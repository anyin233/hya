// hya API v1 — message and part read model over the session projection,
// plus the per-session todo list.
syntax = "proto3";

package hya.v1;

import "google/protobuf/timestamp.proto";
import "hya/v1/common.proto";

// Read surface over the projected transcript. This is a view over the
// event log via the shared projection — the only durable read model.
service Messages {
  // List the transcript messages of a session.
  //
  // hya.http: GET /v1/sessions/{session}/messages
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  // Fetch one message with its parts.
  //
  // hya.http: GET /v1/sessions/{session}/messages/{message}
  rpc GetMessage(GetMessageRequest) returns (MessageInfo);

  // Delete one part of a message (message editing / redaction).
  //
  // hya.http: DELETE /v1/sessions/{session}/messages/{message}/parts/{part}
  rpc DeleteMessagePart(DeleteMessagePartRequest) returns (DeleteMessagePartResponse);

  // Read the session's todo list projection.
  //
  // hya.http: GET /v1/sessions/{session}/todo
  rpc GetSessionTodo(GetSessionTodoRequest) returns (TodoList);
}

// Terminal reason of an assistant message.
enum FinishReason {
  // Unset sentinel; never emitted by the server.
  FINISH_REASON_UNSPECIFIED = 0;
  // Normal completion with no further tool calls.
  FINISH_REASON_STOP = 1;
  // Model requested tools; the turn continues with another round.
  FINISH_REASON_TOOL_CALLS = 2;
  // Hit an output length limit.
  FINISH_REASON_LENGTH = 3;
  // Cancel token, sidecar loss, or client abort.
  FINISH_REASON_CANCELLED = 4;
  // Hard provider/tool failure after the assistant message started.
  FINISH_REASON_ERROR = 5;
}

// Why the harness (not the model) ended an assistant message. Context on
// top of FinishReason; unset when the model ended the message itself.
enum FinishCause {
  // No harness cause recorded.
  FINISH_CAUSE_UNSPECIFIED = 0;
  // A user stopped the turn (client abort, SIGINT on a one-shot run).
  FINISH_CAUSE_USER_CANCEL = 1;
  // The process stopped gracefully and drained in-flight turns.
  FINISH_CAUSE_SHUTDOWN = 2;
  // The member was stopped because its team lead's turn failed.
  FINISH_CAUSE_LEADER_FAILED = 3;
  // The process died with the turn open; closed by startup crash recovery.
  FINISH_CAUSE_INTERRUPTED = 4;
  // The model provider failed the turn.
  FINISH_CAUSE_PROVIDER_ERROR = 5;
  // A cause this server build does not name.
  FINISH_CAUSE_OTHER = 6;
  // The member's parent archived it (`archive` tool) while it was mid-turn.
  FINISH_CAUSE_ARCHIVED = 7;
}

// Author role of a message.
enum Role {
  // Unset sentinel; never emitted by the server.
  ROLE_UNSPECIFIED = 0;
  // Human user message.
  ROLE_USER = 1;
  // Model-generated message.
  ROLE_ASSISTANT = 2;
  // Engine-injected system message.
  ROLE_SYSTEM = 3;
  // Synthetic tool-authored message (for example shell turns).
  ROLE_TOOL = 4;
}

// Token accounting for one model round.
message TokenUsage {
  // Uncached input tokens of the round; excludes `cache_read` and
  // `cache_write`, so the whole prompt is their sum.
  uint64 input = 1;
  // All generated tokens of the round, thinking included.
  uint64 output = 2;
  // Thinking tokens within `output` when the provider reports them; 0 when it
  // does not (the thinking split is then unknown, never estimated).
  uint64 reasoning = 3;
  // Prompt tokens served from cache.
  uint64 cache_read = 4;
  // Prompt tokens written to cache (cache creation).
  uint64 cache_write = 5;
}

// Text part of a message.
message TextPart {
  // Concatenated text content so far.
  string text = 1;
}

// Model reasoning trace part.
message ReasoningPart {
  // Concatenated reasoning content so far.
  string text = 1;
  // Reasoning variant tag when the route exposes one.
  string variant = 2;
}

// A tool invocation requested by the model. One part covers the whole call:
// arguments, execution state, and (once finished) its output or error.
message ToolCallPart {
  // Engine-issued call id. It is `MemberInfo.call_id` of a subagent the call
  // spawned.
  string call_id = 1;
  // Canonical tool name.
  string tool = 2;
  // Tool input as JSON text, in every state (empty while the arguments are
  // still streaming and unparsed).
  string input_json = 3;
  // Execution state of the call.
  ToolExecutionState state = 4;
  // Stable structured error type when the call failed (e.g. `unknown`).
  string error_code = 5;
  // Error text when the call failed, denied, or was blocked.
  string error_message = 6;
  // Tool output as JSON text when the call finished OK: the stored output,
  // under the same size cap the model saw. For the `task` tool it is
  // `{title, metadata: {sessionId, parentSessionId, subagent_type, status},
  // output}`; `metadata.sessionId` is the child session.
  string output_json = 7;
  // Wall time of a finished OK call in milliseconds.
  uint64 duration_ms = 8;
}

// Execution state of one tool call.
enum ToolExecutionState {
  // Unset sentinel; never emitted by the server.
  TOOL_EXECUTION_STATE_UNSPECIFIED = 0;
  // Waiting for admission or permission.
  TOOL_EXECUTION_STATE_PENDING = 1;
  // Currently executing.
  TOOL_EXECUTION_STATE_RUNNING = 2;
  // Completed successfully.
  TOOL_EXECUTION_STATE_OK = 3;
  // Failed with an error.
  TOOL_EXECUTION_STATE_ERROR = 4;
  // Rejected by policy or the user.
  TOOL_EXECUTION_STATE_DENIED = 5;
}

// The outcome of a tool invocation.
message ToolResultPart {
  // Matching call id from `ToolCallPart.call_id`.
  string call_id = 1;
  // Tool output payload (text or serialized JSON).
  string output = 2;
  // Stable error code when the call failed.
  string error_code = 3;
  // Human-readable error text when the call failed.
  string error_message = 4;
}

// A binary or file attachment on a message.
message AttachmentPart {
  // Attachment file name.
  string name = 1;
  // MIME type when known.
  string mime = 2;
  // Inline payload when the backend stored it inline; empty otherwise.
  bytes data = 3;
  // Path reference when the attachment is stored on disk.
  string path = 4;
}

// One part of a message body.
message PartInfo {
  // Part identifier unique within the message.
  string id = 1;
  // Part payload; exactly one kind is set.
  oneof kind {
    // Visible text content.
    TextPart text = 2;
    // Reasoning trace content.
    ReasoningPart reasoning = 3;
    // A tool invocation.
    ToolCallPart tool_call = 4;
    // A tool invocation outcome.
    ToolResultPart tool_result = 5;
    // An attachment.
    AttachmentPart attachment = 6;
  }
}

// Projection snapshot of one message.
message MessageInfo {
  // Message identifier.
  string id = 1;
  // Owning session identifier.
  string session = 2;
  // Author role.
  Role role = 3;
  // Agent the message's turn ran as (assistant messages); empty for user,
  // system, and shell messages and for messages recorded before 0.41.0.
  string agent = 4;
  // Model that produced the message (`provider/model`): the model that
  // served its latest round (after chat.params, fallback, or routing), else
  // the model its turn requested. Empty when unknown.
  string model = 5;
  // Terminal finish reason for assistant messages.
  FinishReason finish = 6;
  // Ordered message parts.
  repeated PartInfo parts = 7;
  // When the message was created (its `MessageStarted` event).
  google.protobuf.Timestamp time_created = 8;
  // When the message projection last changed (parts, live deltas, usage,
  // error, finish).
  google.protobuf.Timestamp time_updated = 9;
  // Harness cause of the finish (cancel, shutdown, crash recovery, provider failure).
  FinishCause finish_cause = 10;
  // Why the turn that drove this assistant message failed; set only when
  // the engine recorded an error for it (`finish` is then
  // `FINISH_REASON_ERROR`).
  MessageError error = 11;
}

// Recorded failure of the turn behind an assistant message.
message MessageError {
  // Stable machine code (for example `provider_error`).
  string code = 1;
  // Human-readable error text as the engine recorded it.
  string message = 2;
}

message ListMessagesRequest {
  // Session identifier.
  string session = 1;
  // Standard pagination controls.
  PageRequest page = 2;
}

message ListMessagesResponse {
  // Messages in append order.
  repeated MessageInfo messages = 1;
  // Pagination outcome.
  PageInfo page = 2;
}

message GetMessageRequest {
  // Session identifier.
  string session = 1;
  // Message identifier.
  string message = 2;
}

message DeleteMessagePartRequest {
  // Session identifier.
  string session = 1;
  // Message identifier.
  string message = 2;
  // Part identifier within the message.
  string part = 3;
}

message DeleteMessagePartResponse {}

// One todo item of a session's plan.
message TodoItem {
  // Stable item identifier.
  string id = 1;
  // Item content text.
  string content = 2;
  // Lifecycle status of the item.
  TodoStatus status = 3;
}

// Lifecycle status of a todo item.
enum TodoStatus {
  // Unset sentinel; never emitted by the server.
  TODO_STATUS_UNSPECIFIED = 0;
  // Not started.
  TODO_STATUS_PENDING = 1;
  // Currently being worked on.
  TODO_STATUS_IN_PROGRESS = 2;
  // Done.
  TODO_STATUS_COMPLETED = 3;
  // Waiting on an external unblock (dependency, user input, review).
  TODO_STATUS_BLOCKED = 4;
}

message GetSessionTodoRequest {
  // Session identifier.
  string session = 1;
}

// A session's todo list projection.
message TodoList {
  // Ordered todo items.
  repeated TodoItem items = 1;
}

// Lifecycle status of a spawned subagent (member).
enum MemberStatus {
  // Unset sentinel; never emitted by the server.
  MEMBER_STATUS_UNSPECIFIED = 0;
  // The child session is being created or admitted.
  MEMBER_STATUS_SPAWNING = 1;
  // The child is running a turn.
  MEMBER_STATUS_RUNNING = 2;
  // The child finished successfully.
  MEMBER_STATUS_DONE = 3;
  // The child failed.
  MEMBER_STATUS_FAILED = 4;
  // The child was cancelled.
  MEMBER_STATUS_CANCELLED = 5;
}

// A subagent (member) spawned by a session, as recorded on the parent's log.
message MemberInfo {
  // Member id within the parent session.
  string member = 1;
  // Child session id when known.
  string child = 2;
  // Subagent type (agent name) of the spawn.
  string agent = 3;
  // Short description of the delegated task.
  string description = 4;
  // Latest lifecycle status.
  MemberStatus status = 5;
  // Bounded finish summary; empty until the member finished.
  string summary = 6;
  // Tool call (`ToolCallPart.call_id`) that spawned the member; empty for
  // members started without a tool call.
  string call_id = 7;
  // Depth in the subagent tree (children of a root session are 1).
  uint32 depth = 8;
}

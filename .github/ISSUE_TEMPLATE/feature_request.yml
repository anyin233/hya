name: Feature request
description: Propose new behaviour or a change to an existing one.
type: Feature
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        New issues start at `needs-triage`. Triage either asks for details (`needs-info`) or sets a type label and `priority: P0`–`P3` and marks the issue `ready-for-develop`; maintainers and agents pick up work only from `ready-for-develop`. Already know exactly what to build? Use the Task form.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What hya should do instead. Name the affected component (crate, package, or command) when you know it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other designs you ruled out.

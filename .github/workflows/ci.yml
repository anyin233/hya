name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Lets the gate be run manually on any branch — useful for validating workflow
  # changes themselves, which `push: [main]` + `pull_request` alone cannot cover.
  workflow_dispatch:
    inputs:
      scope:
        description: "CI scopes to run (all, auto, rust, frontend, docs)"
        required: false
        default: all
        type: choice
        options:
          - all
          - auto
          - rust
          - frontend
          - docs

permissions:
  contents: read

# A newer push to the same PR or branch supersedes the running gate. Pushes to
# main are never cancelled, so every main commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Rust >= 1.90 defaults to bundled rust-lld on x86_64-unknown-linux-gnu
  # (workspace MSRV is 1.91), so leaving the default linker enables fast LLD
  # linking without installing a system linker package.
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# On-demand CI:
# - `changes` classifies modified paths into `rust`, `frontend`, `build_bin`,
#   `tui`, and `docs` scopes (asymmetric: backend changes keep `tui`
#   integration; cross-boundary contract/adapter changes run both Rust and
#   Frontend; pure `public/` and `docs/` edits run only `docs` and skip all
#   code builds).
# - `ci-gate` is the single required status check for `main`, passing iff every
#   upstream job either succeeded or was intentionally skipped.
# - Independent steps carry `if: ${{ !cancelled() }}` so one failure reports on
#   its own instead of skipping the rest.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      build_bin: ${{ steps.filter.outputs.build_bin }}
      tui: ${{ steps.filter.outputs.tui }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: test path classifier
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: classify changed scopes
        id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_SCOPE: ${{ inputs.scope || 'all' }}
        run: python3 .github/scripts/ci_changes.py

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      # `cache-on-failure`: a red gate must still leave a warm cache behind.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: fmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check
      # --all-targets type-checks every lib, bin, test, and example, so a
      # separate `cargo build --workspace` adds nothing here.
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-bin:
    needs: changes
    if: ${{ needs.changes.outputs.build_bin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Full workspace test archiving is the largest build; drop unused SDKs in
      # the background when `rust=true` so the runner has disk headroom.
      - name: free runner disk
        if: ${{ needs.changes.outputs.rust == 'true' }}
        run: sudo sh -c 'nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup >/dev/null 2>&1 &'
      # `xtask gen-api` runs `rustfmt` on the generated gRPC adapter.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        if: ${{ needs.changes.outputs.rust == 'true' }}
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      # When Rust tests are selected, build `hya`, `hya-migration`, `xtask`, all
      # ten lockstep native bundle cdylibs, and every workspace test binary in
      # ONE Cargo invocation, stage the ten `.so` files into the fixed
      # build-unit layout expected by `hya-tool-loader` on Cargo >= 1.100, and
      # archive them for zero-compile `test` and `e2e` jobs.
      - name: build workspace binaries and test archive
        id: build-archive
        if: ${{ needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --no-run --workspace
          for stem in hya_hashline hya_coding_extras hya_multi_agent hya_agent_channels hya_network hya_compaction hya_plan hya_goal hya_loop hya_workflow_bundle; do
            pkg="${stem//_/-}"
            if [[ -f "target/debug/deps/lib${stem}.so" ]]; then
              lib="target/debug/deps/lib${stem}.so"
            else
              lib="$(find "target/debug/build/${pkg}" -name "lib${stem}.so" -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2- || true)"
            fi
            test -n "$lib"
            mkdir -p "target/debug/build/${pkg}/ci-archive/out"
            cp "$lib" "target/debug/build/${pkg}/ci-archive/out/lib${stem}.so"
          done
          cargo nextest archive --locked --profile ci --workspace \
            --archive-file "${RUNNER_TEMP}/ci-nextest-archive.tar.zst"
          rm -rf target/debug/build/*/ci-archive
          test -x target/debug/hya
          test -x target/debug/hya-migration
          test -x target/debug/xtask
      # Pure frontend PRs skip Rust tests and only need `hya` + `xtask` for `tui`.
      - name: build hya and xtask binaries
        id: build-only
        if: ${{ needs.changes.outputs.rust != 'true' }}
        run: cargo build-hya --locked -p hya-migration --bin hya-migration -p xtask --bin xtask
      - name: generated v2 API drift check
        if: ${{ !cancelled() && (steps.build-archive.outcome == 'success' || steps.build-only.outcome == 'success') }}
        run: |
          target/debug/xtask gen-api
          git add --intent-to-add .
          git diff HEAD --exit-code
      # Fails if matrix.toml and the real tests disagree in either direction, or
      # if a T-series numbering hole is neither used nor retired.
      - name: matrix registry check
        if: ${{ !cancelled() && (steps.build-archive.outcome == 'success' || steps.build-only.outcome == 'success') }}
        run: target/debug/xtask matrix-check
      # `hya` loads its ten lockstep first-party native bundles from
      # `<exe-dir>/deps/libhya_*.so`, so ship them alongside `hya`, `hya-migration`, and `xtask`.
      - name: stage prebuilt binaries
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/ci-bins"
          rm -rf "$stage"
          mkdir -p "$stage/deps"
          cp target/debug/hya target/debug/hya-migration target/debug/xtask "$stage/"
          for stem in hya_hashline hya_coding_extras hya_multi_agent hya_agent_channels hya_network hya_compaction hya_plan hya_goal hya_loop hya_workflow_bundle; do
            pkg="${stem//_/-}"
            if [[ -f "target/debug/deps/lib${stem}.so" ]]; then
              cp "target/debug/deps/lib${stem}.so" "$stage/deps/"
            else
              lib="$(find "target/debug/build/${pkg}" -name "lib${stem}.so" -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2- || true)"
              test -n "$lib"
              cp "$lib" "$stage/deps/"
            fi
          done
      - name: upload prebuilt binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-bins
          path: ${{ runner.temp }}/ci-bins
          retention-days: 1
          if-no-files-found: error
      - name: upload nextest archive
        if: ${{ needs.changes.outputs.rust == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-nextest-archive
          path: ${{ runner.temp }}/ci-nextest-archive.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  test:
    needs: [changes, build-bin]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # hya-app runs executable Bundle sidecars under Bun; without it those
      # tests fail with "Bun must be available".
      - uses: ./.github/actions/setup-bun
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: nextest
      - name: download nextest archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-nextest-archive
          path: ${{ runner.temp }}
      # Run all workspace unit/integration tests from the precompiled archive
      # without invoking rustc; hya-e2e runs in parallel in its own job.
      - name: test
        run: |
          cargo-nextest nextest run \
            --archive-file "${RUNNER_TEMP}/ci-nextest-archive.tar.zst" \
            --workspace-remap . \
            --profile ci \
            -E 'not package(hya-e2e)'

  e2e:
    needs: [changes, build-bin]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Bundle and JavaScript Plugin scenarios run under Bun.
      - uses: ./.github/actions/setup-bun
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: nextest
      # Keep prebuilt `hya` and its lockstep `deps/libhya_*.so` outside
      # `target/debug` so archive extraction cannot interfere with them.
      - name: download prebuilt binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-bins
          path: ${{ runner.temp }}/ci-bins
      - name: make prebuilt binaries executable
        run: chmod +x "${RUNNER_TEMP}/ci-bins/hya" "${RUNNER_TEMP}/ci-bins/hya-migration" "${RUNNER_TEMP}/ci-bins/xtask" "${RUNNER_TEMP}/ci-bins/deps/"libhya_*.so
      - name: download nextest archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-nextest-archive
          path: ${{ runner.temp }}
      - name: agent process e2e (Track P, including bare, selective disable, and hya-migration)
        env:
          HYA_E2E_BACKEND_BIN: ${{ runner.temp }}/ci-bins/hya
          HYA_E2E_MIGRATION_BIN: ${{ runner.temp }}/ci-bins/hya-migration
        run: |
          cargo-nextest nextest run \
            --archive-file "${RUNNER_TEMP}/ci-nextest-archive.tar.zst" \
            --workspace-remap . \
            --profile ci-e2e \
            -E 'package(hya-e2e)'

  # Type checks and unit tests of the Bun packages need no Rust build, so they
  # run beside the terminal suite instead of in front of it.
  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: install
        run: |
          for package in packages/hya-tui packages/hya-tui-web packages/hya-tui-sdk crates/hya-plugin-bun/adapter crates/hya-plugin-claude/adapter; do
            (cd "$package" && bun install --frozen-lockfile)
          done
      - name: hya-tui typecheck and unit tests
        if: ${{ !cancelled() }}
        working-directory: packages/hya-tui
        run: bun run typecheck && bun test
      - name: hya-tui-web typecheck and unit tests
        if: ${{ !cancelled() }}
        working-directory: packages/hya-tui-web
        run: bun run typecheck && bun test ./test
      - name: bun adapter typecheck and unit tests
        if: ${{ !cancelled() }}
        working-directory: crates/hya-plugin-bun/adapter
        run: bun run typecheck && bun test
      - name: claude adapter typecheck and unit tests
        if: ${{ !cancelled() }}
        working-directory: crates/hya-plugin-claude/adapter
        run: bun run typecheck && bun test
      - name: hya-tui-sdk typecheck and unit tests
        if: ${{ !cancelled() }}
        working-directory: packages/hya-tui-sdk
        run: bun run typecheck && bun test
      - name: hya-code-mode unit tests
        if: ${{ !cancelled() }}
        working-directory: packages/hya-code-mode
        run: bun test

  tui:
    needs: [changes, build-bin]
    if: ${{ needs.changes.outputs.tui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: download prebuilt binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-bins
          path: target/debug
      - name: make prebuilt binaries executable
        run: chmod +x target/debug/hya target/debug/xtask target/debug/deps/libhya_*.so
      - name: install
        run: |
          for package in packages/hya-tui packages/hya-tui-web packages/hya-tui-sdk crates/hya-plugin-bun/adapter crates/hya-plugin-claude/adapter; do
            (cd "$package" && bun install --frozen-lockfile)
          done
      # The suite runs the TUI the way a release ships it: precompiled JSX in
      # dist/app.js. Running from source would transform the whole UI again on
      # every one of the suite's several hundred launches.
      - name: precompile the TUI
        working-directory: packages/hya-tui
        run: bun run build
      # e2e/hya-tui.spec.ts and e2e/hya-tui-launch-daemon.spec.ts start
      # target/debug/hya (downloaded from `build-bin`), and
      # e2e/hya-tui-bundles-ext.spec.ts runs target/debug/xtask.
      - name: direct PTY protocol checks and full terminal suite
        if: ${{ !cancelled() }}
        working-directory: packages/hya-tui-web
        env:
          HYA_BIN: ${{ github.workspace }}/target/debug/hya
          TMPDIR: ${{ runner.temp }}
          HYA_TUI_EXP_WORKERS: 4
          HYA_TUI_EXP_OUTPUT_DIR: ${{ runner.temp }}/tui-exp-results
        run: bun run test:tui-exp
      - name: upload terminal screens, output and timings
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tui-exp-results
          path: ${{ runner.temp }}/tui-exp-results/
          if-no-files-found: ignore

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/site
    env:
      DOCS_SITE: ${{ vars.DOCS_SITE || format('https://{0}.github.io', github.repository_owner) }}
      PAGES_BASE: ${{ vars.DOCS_BASE || format('/{0}', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Check public/ landing page static assets, anchors, and JS syntax
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/check_web.py
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Check assembled Pages landing page, documentation links, and search index
        run: node scripts/check-build.mjs

  ci-gate:
    name: ci-gate
    if: ${{ always() && !cancelled() }}
    needs:
      - changes
      - lint
      - build-bin
      - test
      - e2e
      - frontend
      - tui
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected CI jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          for name, info in sorted(needs.items()):
              print(f"{name}: {info.get('result')}")

          if needs.get("changes", {}).get("result") != "success":
              print("ERROR: `changes` job did not succeed.", file=sys.stderr)
              sys.exit(1)

          bad = {
              name: info.get("result")
              for name, info in needs.items()
              if info.get("result") not in ("success", "skipped")
          }
          if bad:
              print(f"ERROR: required CI job(s) did not succeed: {bad}", file=sys.stderr)
              sys.exit(1)

          print("All selected CI checks passed.")
          PY

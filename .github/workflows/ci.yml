name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Lets the gate be run manually on any branch — useful for validating workflow
  # changes themselves, which `push: [main]` + `pull_request` alone cannot cover.
  workflow_dispatch:

# A newer push to the same PR or branch supersedes the running gate. Pushes to
# main are never cancelled, so every main commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=bfd"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# The gate is split into independent jobs that run in parallel, each with its
# own Cargo cache. Every step inside a job carries `if: ${{ !cancelled() }}` so
# that one failure reports on its own instead of skipping the rest. A red `fmt`
# used to skip the test step entirely, which hid six failing tests for weeks.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      # `cache-on-failure`: a red gate must still leave a warm cache behind.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: fmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check
      # Fails if matrix.toml and the real tests disagree in either direction, or
      # if a T-series numbering hole is neither used nor retired.
      - name: matrix registry check
        if: ${{ !cancelled() }}
        run: cargo run -p xtask -- matrix-check
      # --all-targets type-checks every lib, bin, test, and example, so a
      # separate `cargo build --workspace` adds nothing here.
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # hya-app runs executable Bundle sidecars under Bun; without it those
      # tests fail with "Bun must be available".
      - uses: ./.github/actions/setup-bun
      # The full test build is the largest one; drop preinstalled SDKs the gate
      # never uses, in the background, so the build has disk headroom.
      - name: free runner disk
        run: sudo sh -c 'nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup >/dev/null 2>&1 &'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      # hya-e2e runs in its own job: it spawns real backend processes, and
      # docs/testing/process-e2e.md requires serial execution.
      # --no-fail-fast: one failing crate must not hide the failures behind it.
      - name: test
        run: cargo test --workspace --exclude hya-e2e --no-fail-fast

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Bundle and JavaScript Plugin scenarios run under Bun.
      - uses: ./.github/actions/setup-bun
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: build agent e2e binaries
        run: cargo build --locked -p hya-backend --bin hya
      - name: agent process e2e (Track P)
        if: ${{ !cancelled() }}
        run: cargo test -p hya-e2e --no-fail-fast -- --test-threads=1

  tui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: hya-tui install
        if: ${{ !cancelled() }}
        working-directory: packages/hya-tui
        run: bun install --frozen-lockfile
      - name: hya-tui-web install
        if: ${{ !cancelled() }}
        working-directory: packages/hya-tui-web
        run: bun install --frozen-lockfile
      - name: bun adapter install
        if: ${{ !cancelled() }}
        working-directory: crates/hya-plugin-bun/adapter
        run: bun install --frozen-lockfile
      - name: hya-tui-sdk install
        if: ${{ !cancelled() }}
        working-directory: packages/hya-tui-sdk
        run: bun install --frozen-lockfile
      - name: hya-tui typecheck and unit tests
        if: ${{ !cancelled() }}
        working-directory: packages/hya-tui
        run: bun run typecheck && bun test
      - name: hya-tui-web typecheck and unit tests
        if: ${{ !cancelled() }}
        working-directory: packages/hya-tui-web
        run: bun run typecheck && bun test ./test
      - name: bun adapter typecheck and unit tests
        if: ${{ !cancelled() }}
        working-directory: crates/hya-plugin-bun/adapter
        run: bun run typecheck && bun test
      - name: hya-tui-sdk typecheck and unit tests
        if: ${{ !cancelled() }}
        working-directory: packages/hya-tui-sdk
        run: bun run typecheck && bun test
      # e2e/hya-tui.spec.ts and e2e/hya-tui-launch.spec.ts start this binary as
      # the backend under test (see docs/tui-web.md#running-the-tests).
      # The disk-inspector spec packages its source with target/debug/xtask.
      - name: build hya and bundle packager
        if: ${{ !cancelled() }}
        run: cargo build --locked -p hya-backend --bin hya -p xtask --bin xtask
      - name: direct PTY protocol checks and full terminal suite
        if: ${{ !cancelled() }}
        working-directory: packages/hya-tui-web
        env:
          HYA_BIN: ${{ github.workspace }}/target/debug/hya
          TMPDIR: ${{ runner.temp }}
          HYA_TUI_EXP_OUTPUT_DIR: ${{ runner.temp }}/tui-exp-results
        run: bun run test:tui-exp
      - name: upload terminal screens, output and timings
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tui-exp-results
          path: ${{ runner.temp }}/tui-exp-results/
          if-no-files-found: ignore

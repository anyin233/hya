name: docs

# PR and push verification of the `public/` landing page and `/docs/` site runs
# inside `.github/workflows/ci.yml` (`docs` job, gated by `ci-gate`). This
# workflow is dedicated to publishing GitHub Pages from `main` so `pages: write`
# / `id-token: write` stay isolated from the main CI gate.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'docs/**'
      - 'proto/hya/v1/**'
      - '.github/scripts/check_web.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/site
    env:
      DOCS_SITE: ${{ vars.DOCS_SITE || format('https://{0}.github.io', github.repository_owner) }}
      PAGES_BASE: ${{ vars.DOCS_BASE || format('/{0}', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Check public/ landing page static assets, anchors, and JS syntax
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/check_web.py
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Check assembled Pages landing page, documentation links, and search index
        run: node scripts/check-build.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/site/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

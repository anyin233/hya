name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
    # A tag run can restore caches saved on the default branch, never those of
    # another tag. Main therefore keeps one warm dependency cache per target;
    # it rebuilds it when the dependency set changes, and the daily schedule
    # catches a new stable toolchain. Path filters do not apply to tag pushes.
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/release.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  BINARY_NAME: hya

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    env:
      TARGET: ${{ matrix.target }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag and metadata
        if: github.ref_type == 'tag'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "release tag '$tag' must match vx.x.x or vx.x.x-<suffix> (for example v0.47.0 or v0.47.0-dev.1)" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Bun 1.4.2
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
          test "$("$HOME/.bun/bin/bun" --version)" = "1.4.2"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install 7-Zip for package smoke test
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then brew install p7zip; else sudo apt-get update && sudo apt-get install -y p7zip-full; fi
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate unified version and changelog
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "hya-backend"))')"
          test "$cargo_version" = "$VERSION"
          manifest_version="$(awk -F '"' '/^version[[:space:]]*=/{print $2; exit}' versions.toml)"
          test "$manifest_version" = "$VERSION"
          frontend_version="$(awk -F '"' '/export const frontendVersion =/{print $2; exit}' packages/hya-tui/frontend-version.ts)"
          test "$frontend_version" = "$VERSION"
          test -s CHANGELOG.md
          first_heading="$(grep -m1 -E '^# ' CHANGELOG.md || true)"
          test "$first_heading" = "# $VERSION"
      - name: Build release inputs
        if: github.ref_type == 'tag' || steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p hya-backend --bins --target "$TARGET"
          cargo build --release --locked -p hya-extended-tools --lib --target "$TARGET"
          cargo build --release --locked -p hya-base-tools -p hya-network-tools -p hya-channel-tools -p hya-compaction --lib --target "$TARGET"
          cargo build --locked -p xtask
      - name: Package unified release asset
        if: github.ref_type == 'tag'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          package_dir="hya-${VERSION}-${TARGET}"
          rm -rf dist
          mkdir -p \
            "dist/$package_dir/bin" \
            "dist/$package_dir/bundles" \
            "dist/$package_dir/lib/hya/bin" \
            "dist/$package_dir/lib/hya/bun-adapter/src" \
            "dist/$package_dir/lib/hya/claude-adapter/src" \
            "dist/$package_dir/lib/hya/tui/src" \
            "dist/$package_dir/lib/hya/tui-web/src" \
            "dist/$package_dir/lib/hya/tui-web/web" \
            "dist/$package_dir/lib/hya/tui-sdk/src"
          install -m 0755 "target/$TARGET/release/hya" "dist/$package_dir/bin/hya"
          cp README.md THIRD_PARTY_NOTICES "dist/$package_dir/"
          install -m 0755 "$HOME/.bun/bin/bun" "dist/$package_dir/lib/hya/bin/bun"
          cp crates/hya-plugin-bun/adapter/package.json crates/hya-plugin-bun/adapter/bun.lock "dist/$package_dir/lib/hya/bun-adapter/"
          cp -R crates/hya-plugin-bun/adapter/src/. "dist/$package_dir/lib/hya/bun-adapter/src/"
          (cd "dist/$package_dir/lib/hya/bun-adapter" && "$HOME/.bun/bin/bun" install --frozen-lockfile --production)
          cp crates/hya-plugin-claude/adapter/package.json crates/hya-plugin-claude/adapter/bun.lock "dist/$package_dir/lib/hya/claude-adapter/"
          cp -R crates/hya-plugin-claude/adapter/src/. "dist/$package_dir/lib/hya/claude-adapter/src/"
          (cd "dist/$package_dir/lib/hya/claude-adapter" && "$HOME/.bun/bin/bun" install --frozen-lockfile --production)
          cp packages/hya-tui-sdk/package.json packages/hya-tui-sdk/bun.lock packages/hya-tui-sdk/tsconfig.json "dist/$package_dir/lib/hya/tui-sdk/"
          cp -R packages/hya-tui-sdk/src/. "dist/$package_dir/lib/hya/tui-sdk/src/"
          (cd "dist/$package_dir/lib/hya/tui-sdk" && "$HOME/.bun/bin/bun" install --frozen-lockfile --production)
          cp packages/hya-tui/frontend-version.ts packages/hya-tui/build.ts packages/hya-tui/package.json packages/hya-tui/bun.lock packages/hya-tui/bunfig.toml packages/hya-tui/tsconfig.json "dist/$package_dir/lib/hya/tui/"
          cp -R packages/hya-tui/src/. "dist/$package_dir/lib/hya/tui/src/"
          (cd "dist/$package_dir/lib/hya/tui" && "$HOME/.bun/bin/bun" install --frozen-lockfile --production)
          (cd "dist/$package_dir/lib/hya/tui" && "$HOME/.bun/bin/bun" run build)
          cp packages/hya-tui-web/package.json packages/hya-tui-web/bun.lock packages/hya-tui-web/tsconfig.json "dist/$package_dir/lib/hya/tui-web/"
          cp -R packages/hya-tui-web/src/. "dist/$package_dir/lib/hya/tui-web/src/"
          cp -R packages/hya-tui-web/web/. "dist/$package_dir/lib/hya/tui-web/web/"
          (cd "dist/$package_dir/lib/hya/tui-web" && "$HOME/.bun/bin/bun" install --frozen-lockfile --production)
          cargo run --locked -p xtask -- stage-first-party-bundles --target "$TARGET" --version "$VERSION" --library-dir "target/$TARGET/release" --package-root "dist/$package_dir" --assets dist
          scripts/package-argus-example.sh bundles/examples/argus-example "dist/$package_dir/examples/hya-argus-example.hyabundle"
          archive="$package_dir.tar.gz"
          tar -czf "dist/$archive" -C dist "$package_dir"
          (cd dist && shasum -a 256 "$archive" ./*.hyabundle > "SHA256SUMS-$TARGET")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Smoke test unified package
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          package_dir="hya-${VERSION}-${TARGET}"
          archive="${package_dir}.tar.gz"
          scratch="$(mktemp -d)"; trap 'rm -rf "$scratch"' EXIT
          tar -xzf "dist/$archive" -C "$scratch"
          listing="$scratch/listing"; tar -tzf "dist/$archive" > "$listing"
          grep -Fx "$package_dir/bin/hya" "$listing"
          grep -Fx "$package_dir/lib/hya/bin/bun" "$listing"
          grep -Fx "$package_dir/lib/hya/bun-adapter/package.json" "$listing"
          grep -Fx "$package_dir/lib/hya/claude-adapter/src/main.ts" "$listing"
          grep -Fx "$package_dir/lib/hya/tui/frontend-version.ts" "$listing"
          grep -Fx "$package_dir/lib/hya/tui/dist/app.js" "$listing"
          grep -Fx "$package_dir/lib/hya/tui-web/web/index.html" "$listing"
          grep -Fx "$package_dir/lib/hya/tui-sdk/src/main.ts" "$listing"
          grep -Fx "$package_dir/examples/hya-argus-example.hyabundle" "$listing"
          test "$("$scratch/$package_dir/bin/hya" --version)" = "hya $VERSION"
          test "$("$scratch/$package_dir/lib/hya/bin/bun" --version)" = "1.4.2"
          (cd dist && shasum -a 256 -c "SHA256SUMS-$TARGET")
          releases="$scratch/releases"
          mkdir -p "$releases/download/v$VERSION" "$releases/latest/download"
          cp "dist/$archive" "$releases/download/v$VERSION/"
          cp "dist/SHA256SUMS-$TARGET" "$releases/download/v$VERSION/SHA256SUMS"
          cp "dist/SHA256SUMS-$TARGET" "$releases/latest/download/SHA256SUMS"
          installed="$scratch/installed"
          smoke_home="$scratch/smoke-home"
          mkdir -p "$smoke_home"
          HOME="$smoke_home" XDG_CONFIG_HOME="$smoke_home/config" XDG_DATA_HOME="$smoke_home/data" \
            XDG_STATE_HOME="$smoke_home/state" XDG_CACHE_HOME="$smoke_home/cache" \
            HYA_RELEASES_URL="file://$releases" \
            sh scripts/hya-install.sh --prefix "$installed"
          test "$("$installed/bin/hya" --version)" = "hya $VERSION"
          HOME="$smoke_home" XDG_CONFIG_HOME="$smoke_home/config" XDG_DATA_HOME="$smoke_home/data" \
            XDG_STATE_HOME="$smoke_home/state" XDG_CACHE_HOME="$smoke_home/cache" \
            HYA_RELEASES_URL="file://$releases" \
            "$installed/bin/hya" update > "$scratch/update.txt"
          grep -F "hya $VERSION is already installed" "$scratch/update.txt"
      - name: Attest release assets
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.hyabundle
            dist/SHA256SUMS-*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type == 'tag'
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.hyabundle
            dist/SHA256SUMS-*
          if-no-files-found: error

  release:
    name: publish GitHub release
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref_type == 'tag'
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-assets-*
          path: artifacts
      - name: Assemble release assets and body
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          mkdir -p dist
          targets=0
          for directory in artifacts/release-assets-*; do
            targets=$((targets + 1))
            (cd "$directory" && shasum -a 256 -c SHA256SUMS-*)
            for asset in "$directory"/*.tar.gz "$directory"/*.hyabundle; do
              name="$(basename "$asset")"
              if [[ -e "dist/$name" ]]; then
                cmp "$asset" "dist/$name"
              else
                cp "$asset" "dist/$name"
              fi
            done
          done
          test "$targets" -eq 3
          (cd dist && shasum -a 256 ./*.tar.gz ./*.hyabundle > SHA256SUMS)
          (cd dist && shasum -a 256 -c SHA256SUMS)
          cp CHANGELOG.md RELEASE_NOTES.md
          printf "\n\nInstall or update this release with:\n\n\`\`\`sh\ncurl -fsSL https://hya.ed-aisys.com/install.sh | sh -s -- --version %s\n\`\`\`\n\nWithout \`--version\` the installer installs the latest stable release.\n" \
            "$version" >> RELEASE_NOTES.md
      - name: Attest combined checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true

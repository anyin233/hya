name: release

on:
  push:
    tags:
      - "backend/*"
      - "frontend/*"
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/release.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  BINARY_NAME: hya

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    env:
      TARGET: ${{ matrix.target }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select release component
        if: github.ref_type == 'tag'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            backend/*) component=backend; version=${tag#backend/} ;;
            frontend/*) component=frontend; version=${tag#frontend/} ;;
            *) echo "release tag must use backend/<version> or frontend/<version>" >&2; exit 1 ;;
          esac
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo "invalid release version $version" >&2; exit 1; }
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "COMPONENT=$component" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Bun 1.4.2
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
          test "$("$HOME/.bun/bin/bun" --version)" = "1.4.2"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install 7-Zip for package smoke test
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then brew install p7zip; else sudo apt-get update && sudo apt-get install -y p7zip-full; fi
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate release metadata
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COMPONENT" == backend ]]; then
            cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "hya-backend"))')"
            test "$cargo_version" = "$VERSION"
            grep -m1 -Fx "# $VERSION" CHANGELOG_BACKEND.md
          else
            frontend_version="$(awk -F '"' '/^\[frontend\]/{in_frontend=1; next} in_frontend && /^version/{print $2; exit}' versions.toml)"
            test "$frontend_version" = "$VERSION"
            grep -m1 -Fx "# $VERSION" CHANGELOG_FRONTEND.md
            grep -F "$VERSION" packages/hya-tui/frontend-version.ts
          fi
      - name: Build release inputs
        if: github.ref_type == 'tag' || steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != tag || "${COMPONENT:-}" == backend ]]; then
            cargo build --release --locked -p hya-backend --bins --target "$TARGET"
            cargo build --release --locked -p hya-todo-tools --lib --target "$TARGET"
            cargo build --release --locked -p hya-extended-tools --lib --target "$TARGET"
            cargo build --release --locked -p hya-base-tools -p hya-network-tools -p hya-channel-tools --lib --target "$TARGET"
          fi
          cargo build --locked -p xtask
      - name: Package side-specific release asset
        if: github.ref_type == 'tag'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          package_dir="hya-${COMPONENT}-${VERSION}-${TARGET}"
          rm -rf dist
          mkdir -p "dist/$package_dir/lib/hya"
          if [[ "$COMPONENT" == backend ]]; then
            mkdir -p "dist/$package_dir/bin" "dist/$package_dir/lib/hya/bin" "dist/$package_dir/lib/hya/bun-adapter/src" "dist/$package_dir/bundles"
            cp "target/$TARGET/release/hya" "dist/$package_dir/bin/hya"
            cp README.md THIRD_PARTY_NOTICES "dist/$package_dir/"
            install -m 0755 "$HOME/.bun/bin/bun" "dist/$package_dir/lib/hya/bin/bun"
            cp crates/hya-plugin-bun/adapter/package.json crates/hya-plugin-bun/adapter/bun.lock "dist/$package_dir/lib/hya/bun-adapter/"
            cp -R crates/hya-plugin-bun/adapter/src/. "dist/$package_dir/lib/hya/bun-adapter/src/"
            (cd "dist/$package_dir/lib/hya/bun-adapter" && "$HOME/.bun/bin/bun" install --frozen-lockfile --production)
            cargo run --locked -p xtask -- stage-first-party-bundles --target "$TARGET" --version "$VERSION" --library-dir "target/$TARGET/release" --package-root "dist/$package_dir" --assets dist
            scripts/package-argus-example.sh bundles/examples/argus-example "dist/$package_dir/examples/hya-argus-example.hyabundle"
          else
            mkdir -p "dist/$package_dir/lib/hya/bin" "dist/$package_dir/lib/hya/tui/src" "dist/$package_dir/lib/hya/tui-web/src" "dist/$package_dir/lib/hya/tui-web/web" "dist/$package_dir/lib/hya/tui-sdk/src"
            install -m 0755 "$HOME/.bun/bin/bun" "dist/$package_dir/lib/hya/bin/bun"
            cp packages/hya-tui/frontend-version.ts "dist/$package_dir/lib/hya/tui/frontend-version.ts"
            cp packages/hya-tui/build.ts packages/hya-tui/package.json packages/hya-tui/bun.lock packages/hya-tui/bunfig.toml packages/hya-tui/tsconfig.json "dist/$package_dir/lib/hya/tui/"
            cp -R packages/hya-tui/src/. "dist/$package_dir/lib/hya/tui/src/"
            cp packages/hya-tui-sdk/package.json packages/hya-tui-sdk/bun.lock packages/hya-tui-sdk/tsconfig.json "dist/$package_dir/lib/hya/tui-sdk/"
            cp -R packages/hya-tui-sdk/src/. "dist/$package_dir/lib/hya/tui-sdk/src/"
            (cd "dist/$package_dir/lib/hya/tui-sdk" && "$HOME/.bun/bin/bun" install --frozen-lockfile --production)
            (cd "dist/$package_dir/lib/hya/tui" && "$HOME/.bun/bin/bun" install --frozen-lockfile --production)
            (cd "dist/$package_dir/lib/hya/tui" && "$HOME/.bun/bin/bun" run build)
            cp packages/hya-tui-web/package.json packages/hya-tui-web/bun.lock packages/hya-tui-web/tsconfig.json "dist/$package_dir/lib/hya/tui-web/"
            cp -R packages/hya-tui-web/src/. "dist/$package_dir/lib/hya/tui-web/src/"
            cp -R packages/hya-tui-web/web/. "dist/$package_dir/lib/hya/tui-web/web/"
            (cd "dist/$package_dir/lib/hya/tui-web" && "$HOME/.bun/bin/bun" install --frozen-lockfile --production)
          fi
          archive="$package_dir.tar.gz"
          tar -czf "dist/$archive" -C dist "$package_dir"
          if [[ "$COMPONENT" == backend ]]; then
            (cd dist && shasum -a 256 "$archive" ./*.hyabundle > SHA256SUMS)
          else
            (cd dist && shasum -a 256 "$archive" > SHA256SUMS)
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Smoke test side-specific package
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          package_dir="hya-${COMPONENT}-${VERSION}-${TARGET}"
          scratch="$(mktemp -d)"; trap 'rm -rf "$scratch"' EXIT
          tar -xzf "dist/${package_dir}.tar.gz" -C "$scratch"
          listing="$scratch/listing"; tar -tzf "dist/${package_dir}.tar.gz" > "$listing"
          if [[ "$COMPONENT" == backend ]]; then
            grep -Fx "$package_dir/bin/hya" "$listing"
            grep -Fx "$package_dir/lib/hya/bun-adapter/package.json" "$listing"
            if grep -q -- "$package_dir/lib/hya/tui" "$listing"; then
              exit 1
            fi
            if grep -q -- "$package_dir/lib/hya/tui-web" "$listing"; then
              exit 1
            fi
          else
            grep -Fx "$package_dir/lib/hya/bin/bun" "$listing"
            grep -Fx "$package_dir/lib/hya/tui/frontend-version.ts" "$listing"
            grep -Fx "$package_dir/lib/hya/tui-web/web/index.html" "$listing"
            if grep -q -- "$package_dir/bin/hya" "$listing"; then
              exit 1
            fi
            if grep -q -- "$package_dir/bundles/" "$listing"; then
              exit 1
            fi
          fi
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Attest release assets
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.hyabundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type == 'tag'
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref_type == 'tag'
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select release component
        id: release
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          case "$tag" in backend/*) echo "component=backend" >> "$GITHUB_OUTPUT"; version=${tag#backend/};; frontend/*) echo "component=frontend" >> "$GITHUB_OUTPUT"; version=${tag#frontend/};; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-assets-*
          path: artifacts
      - name: Assemble release assets and body
        shell: bash
        env:
          COMPONENT: ${{ steps.release.outputs.component }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for directory in artifacts/release-assets-*; do
            for asset in "$directory"/*; do
              if [[ -f "$asset" ]]; then cp "$asset" dist/; fi
            done
          done
          if [[ "$COMPONENT" == backend ]]; then
            (cd dist && shasum -a 256 ./*.tar.gz ./*.hyabundle > SHA256SUMS)
          else
            (cd dist && shasum -a 256 ./*.tar.gz > SHA256SUMS)
          fi
          cp "CHANGELOG_${COMPONENT^^}.md" dist/RELEASE_NOTES.md
          side_flag=--backend-only
          [[ "$COMPONENT" == frontend ]] && side_flag=--tui-only
          printf "\n\nInstall or update this release with:\n\n\`\`\`sh\ncurl -fsSL https://hya.ed-aisys.com/install.sh | sh -s -- %s --version %s\n\`\`\`\n\nWithout options the installer installs the latest backend and frontend.\n" \
            "$side_flag" "$VERSION" >> dist/RELEASE_NOTES.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true

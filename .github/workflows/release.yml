name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  BINARY_NAME: hya
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    name: build release binary
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Bun 1.3.14
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
          test "$("$HOME/.bun/bin/bun" --version)" = "1.3.14"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install 7-Zip for Workflow package smoke test
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Validate tag version and changelog
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ "$tag" == "$version" || -z "$version" ]]; then
            echo "release tags must be prefixed with v" >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "version $version is not semver-shaped" >&2
            exit 1
          fi

          cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; metadata = json.load(sys.stdin); print(next(package["version"] for package in metadata["packages"] if package["name"] == "hya-backend"))')"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "tag version $version does not match hya-backend version $cargo_version" >&2
            exit 1
          fi

          if [[ ! -s CHANGELOG.md ]]; then
            echo "CHANGELOG.md must exist and contain the newest release notes" >&2
            exit 1
          fi
          first_heading="$(grep -m1 -E '^# ' CHANGELOG.md || true)"
          if [[ "$first_heading" != "# $version" ]]; then
            echo "CHANGELOG.md first heading must be # $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release --locked -p hya-backend --bins --target "$TARGET"
          cargo build --release --locked -p hya-todo-tools --lib --target "$TARGET"
          cargo build --release --locked -p hya-extended-tools --lib --target "$TARGET"
          cargo build --release --locked -p hya-base-tools -p hya-network-tools -p hya-channel-tools --lib --target "$TARGET"

      - name: Package release asset
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          version="$VERSION"
          package_dir="${BINARY_NAME}-${version}-${TARGET}"
          archive="${package_dir}.tar.gz"

          rm -rf dist
          bun_adapter="dist/$package_dir/lib/hya/bun-adapter"
          mkdir -p "dist/$package_dir/bin" "$bun_adapter/src"
          cp "target/$TARGET/release/hya-backend" "dist/$package_dir/bin/"
          cp README.md "dist/$package_dir/"
          chmod 755 "dist/$package_dir/bin/hya-backend"
          cp crates/hya-plugin-bun/adapter/package.json \
            crates/hya-plugin-bun/adapter/bun.lock "$bun_adapter/"
          cp -R crates/hya-plugin-bun/adapter/src/. "$bun_adapter/src/"
          (cd "$bun_adapter" && "$HOME/.bun/bin/bun" install --frozen-lockfile --production)
          cargo run --locked -p xtask -- stage-first-party-bundles --target "$TARGET" --version "$version" --library-dir "target/$TARGET/release" --package-root "dist/$package_dir" --assets dist
          scripts/package-argus-example.sh bundles/examples/argus-example \
            "dist/$package_dir/examples/hya-argus-example.hyabundle"

          tar -czf "dist/$archive" -C dist "$package_dir"
          (cd dist && sha256sum "$archive" hya-*.hyabundle > SHA256SUMS)

          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Smoke test packaged binary
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          version="$VERSION"
          package_dir="${BINARY_NAME}-${version}-${TARGET}"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT

          tar -xzf "dist/$ARCHIVE" -C "$scratch"
          packaged_binary="$scratch/$package_dir/bin/hya-backend"
          "$packaged_binary" --version | tee "$scratch/version.txt"
          grep -F "$version" "$scratch/version.txt"
          "$packaged_binary" --help >/dev/null
          (cd dist && sha256sum -c SHA256SUMS)
          asset_count=0
          for asset in dist/hya-*.hyabundle; do
            name="$(basename "$asset" .hyabundle)"
            name="${name#hya-}"
            name="${name%-"$TARGET"}"
            name="${name%-"$version"}"
            cmp "$asset" "$scratch/$package_dir/bundles/hya-$name.hyabundle"
            asset_count=$((asset_count + 1))
          done
          test "$asset_count" -eq 12
          test "$(find "$scratch/$package_dir/bundles" -name 'hya-*.hyabundle' | wc -l)" -eq 12
          smoke_home="$scratch/smoke-home"
          mkdir -p "$smoke_home"
          HOME="$smoke_home" XDG_CONFIG_HOME="$smoke_home/config" XDG_DATA_HOME="$smoke_home/data" \
            XDG_STATE_HOME="$smoke_home/state" XDG_CACHE_HOME="$smoke_home/cache" \
            "$packaged_binary" bundle list > "$scratch/bundle-list.txt"
          for bundle in base-tools extended-tools network-tools channel-tools todo-tools core-skills core-commands core-agents agent-channels goal-loop plan-impl-review subagents; do
            grep -E "^hya/$bundle $version " "$scratch/bundle-list.txt"
          done
          bun_adapter="$scratch/$package_dir/lib/hya/bun-adapter"
          for path in package.json bun.lock src/main.ts; do
            test -e "$bun_adapter/$path"
          done
          bun_probe="$scratch/bun-adapter-probe"
          bun_output="$scratch/bun-adapter-output"
          mkdir -p "$bun_probe"
          (
            cd "$bun_probe"
            env -u HYA_BUN_ADAPTER_DIR HYA_DIRECTORY="$bun_probe" HYA_WORKTREE="$bun_probe" \
              "$HOME/.bun/bin/bun" run "$bun_adapter/src/main.ts" >"$bun_output" <<'BUN_REQUESTS'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocol_version":1,"host":{"name":"hya","version":"release"}}}
          {"jsonrpc":"2.0","id":2,"method":"shutdown","params":{}}
          BUN_REQUESTS
          )
          grep -F '"protocol_version":1' "$bun_output"
          grep -F '"hooks":[]' "$bun_output"
          grep -F '"tools":[]' "$bun_output"
          grep -F '"id":2,"result":{}' "$bun_output"
          example_archive="$scratch/$package_dir/examples/hya-argus-example.hyabundle"
          test -f "$example_archive"
          7z t "$example_archive" >/dev/null
          7z l -slt "$example_archive" >"$scratch/argus-listing.txt"
          grep -Fx "Path = bundle.yaml" "$scratch/argus-listing.txt"
          grep -Fx "Path = workflows/argus.hya.md" "$scratch/argus-listing.txt"
          if grep -F "bundles/examples/argus-example" "$scratch/argus-listing.txt"; then
            echo "Argus archive must not contain its source-tree prefix" >&2
            exit 1
          fi
          tar -tzf "dist/$ARCHIVE" > "$scratch/archive.txt"
          grep -Fx "$package_dir/bin/hya-backend" "$scratch/archive.txt"
          grep -Fx "$package_dir/lib/hya/bun-adapter/package.json" "$scratch/archive.txt"
          grep -Fx "$package_dir/lib/hya/bun-adapter/bun.lock" "$scratch/archive.txt"
          grep -Fx "$package_dir/lib/hya/bun-adapter/src/main.ts" "$scratch/archive.txt"
          grep -F "$package_dir/lib/hya/bun-adapter/node_modules/" "$scratch/archive.txt" >/dev/null
          for bundle in base-tools extended-tools network-tools channel-tools todo-tools core-skills core-commands core-agents agent-channels goal-loop plan-impl-review subagents; do
            grep -Fx "$package_dir/bundles/hya-$bundle.hyabundle" "$scratch/archive.txt"
          done
          grep -Fx "$package_dir/examples/hya-argus-example.hyabundle" "$scratch/archive.txt"
          if grep -F "$package_dir/bundles/examples/argus-example" "$scratch/archive.txt"; then
            echo "release archive must not contain the example source-tree prefix" >&2
            exit 1
          fi

      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.hyabundle
            dist/SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ env.TARGET }}
          path: |
            dist/*.tar.gz
            dist/*.hyabundle
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: publish GitHub release
    runs-on: ubuntu-22.04
    needs: build
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release notes
        shell: bash
        run: test -s CHANGELOG.md

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          body_path: CHANGELOG.md
          files: dist/*
          fail_on_unmatched_files: true

name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  BINARY_NAME: hya

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    env:
      TARGET: ${{ matrix.target }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Bun 1.4.2
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
          test "$("$HOME/.bun/bin/bun" --version)" = "1.4.2"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install 7-Zip for Workflow package smoke test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install p7zip
          else
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.target }}

      - name: Validate tag version and changelog
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ "$tag" == "$version" || -z "$version" ]]; then
            echo "release tags must be prefixed with v" >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "version $version is not semver-shaped" >&2
            exit 1
          fi

          cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; metadata = json.load(sys.stdin); print(next(package["version"] for package in metadata["packages"] if package["name"] == "hya-backend"))')"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "tag version $version does not match hya version $cargo_version" >&2
            exit 1
          fi

          if [[ ! -s CHANGELOG.md ]]; then
            echo "CHANGELOG.md must exist and contain the newest release notes" >&2
            exit 1
          fi
          first_heading="$(grep -m1 -E '^# ' CHANGELOG.md || true)"
          if [[ "$first_heading" != "# $version" ]]; then
            echo "CHANGELOG.md first heading must be # $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release --locked -p hya-backend --bins --target "$TARGET"
          cargo build --release --locked -p hya-todo-tools --lib --target "$TARGET"
          cargo build --release --locked -p hya-extended-tools --lib --target "$TARGET"
          cargo build --release --locked -p hya-base-tools -p hya-network-tools -p hya-channel-tools --lib --target "$TARGET"

      - name: Package release asset
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          version="$VERSION"
          package_dir="${BINARY_NAME}-${version}-${TARGET}"
          archive="${package_dir}.tar.gz"

          # macOS tar would otherwise add AppleDouble `._*` entries.
          export COPYFILE_DISABLE=1
          rm -rf dist
          bun_adapter="dist/$package_dir/lib/hya/bun-adapter"
          mkdir -p "dist/$package_dir/bin" "$bun_adapter/src"
          cp "target/$TARGET/release/hya" "dist/$package_dir/bin/"
          cp README.md "dist/$package_dir/"
          chmod 755 "dist/$package_dir/bin/hya"
          cp crates/hya-plugin-bun/adapter/package.json \
            crates/hya-plugin-bun/adapter/bun.lock "$bun_adapter/"
          cp -R crates/hya-plugin-bun/adapter/src/. "$bun_adapter/src/"
          (cd "$bun_adapter" && "$HOME/.bun/bin/bun" install --frozen-lockfile --production)
          # Bare `hya` runs the TUI and the WebUI host from these directories.
          # Installing on this runner pulls the host's OpenTUI native package.
          tui="dist/$package_dir/lib/hya/tui"
          tui_web="dist/$package_dir/lib/hya/tui-web"
          mkdir -p "$tui/src" "$tui_web/src" "$tui_web/web"
          cp packages/hya-tui/package.json packages/hya-tui/bun.lock \
            packages/hya-tui/bunfig.toml packages/hya-tui/tsconfig.json "$tui/"
          cp -R packages/hya-tui/src/. "$tui/src/"
          (cd "$tui" && "$HOME/.bun/bin/bun" install --frozen-lockfile --production)
          cp packages/hya-tui-web/package.json packages/hya-tui-web/bun.lock \
            packages/hya-tui-web/tsconfig.json "$tui_web/"
          cp -R packages/hya-tui-web/src/. "$tui_web/src/"
          cp -R packages/hya-tui-web/web/. "$tui_web/web/"
          (cd "$tui_web" && "$HOME/.bun/bin/bun" install --frozen-lockfile --production)
          cargo run --locked -p xtask -- stage-first-party-bundles --target "$TARGET" --version "$version" --library-dir "target/$TARGET/release" --package-root "dist/$package_dir" --assets dist
          scripts/package-argus-example.sh bundles/examples/argus-example \
            "dist/$package_dir/examples/hya-argus-example.hyabundle"

          tar -czf "dist/$archive" -C dist "$package_dir"
          (cd dist && shasum -a 256 "$archive" hya-*.hyabundle > "SHA256SUMS-$TARGET")

          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Smoke test packaged binary
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          version="$VERSION"
          package_dir="${BINARY_NAME}-${version}-${TARGET}"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT

          tar -xzf "dist/$ARCHIVE" -C "$scratch"
          packaged_binary="$scratch/$package_dir/bin/hya"
          "$packaged_binary" --version | tee "$scratch/version.txt"
          grep -F "$version" "$scratch/version.txt"
          "$packaged_binary" --help >/dev/null
          (cd dist && shasum -a 256 -c "SHA256SUMS-$TARGET")
          asset_count=0
          for asset in dist/hya-*.hyabundle; do
            name="$(basename "$asset" .hyabundle)"
            name="${name#hya-}"
            name="${name%-"$TARGET"}"
            name="${name%-"$version"}"
            cmp "$asset" "$scratch/$package_dir/bundles/hya-$name.hyabundle"
            asset_count=$((asset_count + 1))
          done
          test "$asset_count" -eq 12
          test "$(find "$scratch/$package_dir/bundles" -name 'hya-*.hyabundle' | wc -l)" -eq 12
          smoke_home="$scratch/smoke-home"
          mkdir -p "$smoke_home"
          HOME="$smoke_home" XDG_CONFIG_HOME="$smoke_home/config" XDG_DATA_HOME="$smoke_home/data" \
            XDG_STATE_HOME="$smoke_home/state" XDG_CACHE_HOME="$smoke_home/cache" \
            "$packaged_binary" bundle list > "$scratch/bundle-list.txt"
          for bundle in base-tools extended-tools network-tools channel-tools todo-tools core-skills core-commands core-agents agent-channels goal-loop plan-impl-review subagents; do
            grep -E "^hya/$bundle $version " "$scratch/bundle-list.txt"
          done
          bun_adapter="$scratch/$package_dir/lib/hya/bun-adapter"
          for path in package.json bun.lock src/main.ts; do
            test -e "$bun_adapter/$path"
          done
          bun_probe="$scratch/bun-adapter-probe"
          bun_output="$scratch/bun-adapter-output"
          mkdir -p "$bun_probe"
          (
            cd "$bun_probe"
            env -u HYA_BUN_ADAPTER_DIR HYA_DIRECTORY="$bun_probe" HYA_WORKTREE="$bun_probe" \
              "$HOME/.bun/bin/bun" run "$bun_adapter/src/main.ts" >"$bun_output" <<'BUN_REQUESTS'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocol_version":1,"host":{"name":"hya","version":"release"}}}
          {"jsonrpc":"2.0","id":2,"method":"shutdown","params":{}}
          BUN_REQUESTS
          )
          grep -F '"protocol_version":1' "$bun_output"
          grep -F '"hooks":[]' "$bun_output"
          grep -F '"tools":[]' "$bun_output"
          grep -F '"id":2,"result":{}' "$bun_output"
          tui="$scratch/$package_dir/lib/hya/tui"
          tui_web="$scratch/$package_dir/lib/hya/tui-web"
          case "$TARGET" in
            x86_64-unknown-linux-gnu) opentui_native=linux-x64 ;;
            aarch64-unknown-linux-gnu) opentui_native=linux-arm64 ;;
            aarch64-apple-darwin) opentui_native=darwin-arm64 ;;
            *) echo "no OpenTUI native package is known for $TARGET" >&2; exit 1 ;;
          esac
          for path in package.json bun.lock bunfig.toml tsconfig.json src/main.ts \
            node_modules/@opentui/core/package.json node_modules/@opentui/solid/package.json \
            "node_modules/@opentui/core-$opentui_native/package.json" node_modules/solid-js/package.json; do
            test -f "$tui/$path"
          done
          test ! -e "$tui/node_modules/bun-types"
          for path in package.json bun.lock tsconfig.json src/main.ts src/frames.ts \
            web/index.html web/client.ts web/style.css \
            node_modules/@xterm/xterm/package.json node_modules/@xterm/xterm/css/xterm.css \
            node_modules/@xterm/addon-fit/package.json; do
            test -f "$tui_web/$path"
          done
          for dev_dependency in @playwright/test @opentui/core bun-types typescript; do
            test ! -e "$tui_web/node_modules/$dev_dependency"
          done
          tui_probe="$scratch/tui-probe"
          mkdir -p "$tui_probe"
          (
            cd "$tui_probe"
            env -u HYA_TUI_DIR -u HYA_TUI_WEB_DIR "$HOME/.bun/bin/bun" "$tui/src/main.ts" --help > tui-help.txt
            grep -F "Usage:" tui-help.txt
            env -u HYA_TUI_DIR -u HYA_TUI_WEB_DIR "$HOME/.bun/bin/bun" "$tui_web/src/main.ts" --help > tui-web-help.txt
            grep -F "Usage:" tui-web-help.txt
            # `--help` skips lazily loaded modules; bundling resolves every import
            # and fails on any that leaves the staged directory.
            "$HOME/.bun/bin/bun" build --target=bun --external '@opentui/core-*' \
              --outdir tui-build "$tui/src/main.ts" >/dev/null
            "$HOME/.bun/bin/bun" build --target=bun --outdir tui-web-build "$tui_web/src/main.ts" >/dev/null
          )
          example_archive="$scratch/$package_dir/examples/hya-argus-example.hyabundle"
          test -f "$example_archive"
          7z t "$example_archive" >/dev/null
          7z l -slt "$example_archive" >"$scratch/argus-listing.txt"
          grep -Fx "Path = bundle.yaml" "$scratch/argus-listing.txt"
          grep -Fx "Path = workflows/argus.hya.md" "$scratch/argus-listing.txt"
          if grep -F "bundles/examples/argus-example" "$scratch/argus-listing.txt"; then
            echo "Argus archive must not contain its source-tree prefix" >&2
            exit 1
          fi
          tar -tzf "dist/$ARCHIVE" > "$scratch/archive.txt"
          grep -Fx "$package_dir/bin/hya" "$scratch/archive.txt"
          grep -Fx "$package_dir/lib/hya/bun-adapter/package.json" "$scratch/archive.txt"
          grep -Fx "$package_dir/lib/hya/bun-adapter/bun.lock" "$scratch/archive.txt"
          grep -Fx "$package_dir/lib/hya/bun-adapter/src/main.ts" "$scratch/archive.txt"
          grep -F "$package_dir/lib/hya/bun-adapter/node_modules/" "$scratch/archive.txt" >/dev/null
          grep -Fx "$package_dir/lib/hya/tui/src/main.ts" "$scratch/archive.txt"
          grep -F "$package_dir/lib/hya/tui/node_modules/@opentui/core/" "$scratch/archive.txt" >/dev/null
          grep -Fx "$package_dir/lib/hya/tui-web/src/main.ts" "$scratch/archive.txt"
          grep -Fx "$package_dir/lib/hya/tui-web/web/index.html" "$scratch/archive.txt"
          grep -F "$package_dir/lib/hya/tui-web/node_modules/@xterm/xterm/" "$scratch/archive.txt" >/dev/null
          for bundle in base-tools extended-tools network-tools channel-tools todo-tools core-skills core-commands core-agents agent-channels goal-loop plan-impl-review subagents; do
            grep -Fx "$package_dir/bundles/hya-$bundle.hyabundle" "$scratch/archive.txt"
          done
          grep -Fx "$package_dir/examples/hya-argus-example.hyabundle" "$scratch/archive.txt"
          if grep -F "$package_dir/bundles/examples/argus-example" "$scratch/archive.txt"; then
            echo "release archive must not contain the example source-tree prefix" >&2
            exit 1
          fi

      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.hyabundle
            dist/SHA256SUMS-*

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.hyabundle
            dist/SHA256SUMS-*
          if-no-files-found: error

  release:
    name: publish GitHub release
    runs-on: ubuntu-22.04
    needs: build
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release notes
        shell: bash
        run: test -s CHANGELOG.md

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-assets-*
          path: artifacts

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          targets=0
          for directory in artifacts/release-assets-*; do
            targets=$((targets + 1))
            (cd "$directory" && shasum -a 256 -c SHA256SUMS-*)
            for file in "$directory"/*; do
              name="$(basename "$file")"
              if [[ -e "dist/$name" ]]; then
                # Platform-independent bundles must be byte-identical on every target.
                cmp "$file" "dist/$name"
              else
                cp "$file" "dist/$name"
              fi
            done
          done
          test "$targets" -eq 3
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq "$targets"
          test "$(find dist -name 'hya-*.hyabundle' | wc -l)" -eq $((5 * targets + 7))
          (cd dist && for file in *.tar.gz hya-*.hyabundle; do shasum -a 256 "$file"; done > SHA256SUMS)
          (cd dist && shasum -a 256 -c SHA256SUMS)

      - name: Attest combined checksums
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          body_path: CHANGELOG.md
          files: dist/*
          fail_on_unmatched_files: true

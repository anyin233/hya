<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1160" height="520" rx="14" fill="#0f172a"/>
  <rect x="12" y="12" width="1136" height="496" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <text x="36" y="46" fill="#f8fafc" font-size="19" font-weight="700">hya  —  Episodic Resident Subagents, Vertical Channels &amp; Zero-Trust Relay</text>
  <text x="36" y="68" fill="#94a3b8" font-size="12">ADR-0015 Episodic Actors · ADR-0016 Vertical #announce / #DM Channels · ADR-0025 Noise_NKpsk0 Secure Relay</text>

  <!-- Left Half: Episodic Subagent Lifecycle & Vertical Hierarchy -->
  <rect x="28" y="88" width="564" height="404" rx="10" fill="#1e293b" fill-opacity="0.55" stroke="#334155"/>
  <text x="46" y="111" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="0.06em">EPISODIC RESIDENT ACTOR LIFECYCLE &amp; VERTICAL TOPOLOGY</text>

  <rect x="46" y="126" width="250" height="78" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="60" y="147" fill="#f1f5f9" font-size="12.5" font-weight="600">1. Non-Blocking Spawn (task)</text>
  <text x="60" y="165" fill="#94a3b8" font-size="10.8">" Atomic batch + active claim</text>
  <text x="60" y="181" fill="#94a3b8" font-size="10.8">" ActorClaim(epoch=1) + #DM-{8}</text>
  <text x="60" y="196" fill="#64748b" font-size="10.2">" Handle: main/&lt;type&gt;-&lt;operator&gt;</text>

  <line x1="296" y1="165" x2="322" y2="165" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a-sky)"/>

  <rect x="324" y="126" width="250" height="78" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="338" y="147" fill="#f1f5f9" font-size="12.5" font-weight="600">2. Episode n (Working ─ Idle)</text>
  <text x="338" y="165" fill="#94a3b8" font-size="10.8">" Idle at 0 token cost</text>
  <text x="338" y="181" fill="#94a3b8" font-size="10.8">" Atomic mail wake coalescing</text>
  <text x="338" y="196" fill="#64748b" font-size="10.2">" Fenced by ResidentWorkStarted</text>

  <line x1="449" y1="204" x2="449" y2="230" stroke="#34d399" stroke-width="1.5" marker-end="url(#a-green)"/>

  <rect x="324" y="232" width="250" height="82" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="338" y="253" fill="#f1f5f9" font-size="12.5" font-weight="600">3. Report &amp; Archive Txn</text>
  <text x="338" y="271" fill="#94a3b8" font-size="10.8">" Gate: inbox read &amp; children archived</text>
  <text x="338" y="287" fill="#94a3b8" font-size="10.8">" State Handoff(n) + claim release</text>
  <text x="338" y="303" fill="#64748b" font-size="10.2">" Report mail on #DM wakes Parent</text>

  <line x1="324" y1="273" x2="298" y2="273" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a-purple)"/>

  <rect x="46" y="232" width="250" height="82" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="60" y="253" fill="#f1f5f9" font-size="12.5" font-weight="600">4. Downward DM Revival</text>
  <text x="60" y="271" fill="#94a3b8" font-size="10.8">" Parent sends DM (or Workflow retry)</text>
  <text x="60" y="287" fill="#94a3b8" font-size="10.8">" epoch + 1 &amp; capacity claim</text>
  <text x="60" y="303" fill="#64748b" font-size="10.2">" Context: system + Handoff(n) + DM</text>

  <path d="M 171 232 L 171 214 L 360 214 L 360 204" fill="none" stroke="#a78bfa" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#a-purple)"/>

  <!-- Vertical Channel Plane Mini-Box -->
  <rect x="46" y="330" width="528" height="146" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="62" y="352" fill="#f8fafc" font-size="12.5" font-weight="600">Vertical Channel Plane (MAX_SUBAGENT_DEPTH = 2 · No Sibling Visibility)</text>
  <text x="62" y="374" fill="#94a3b8" font-size="11">" Depth 0 (Root): main   ↔  ↔ [#DM-xxxx] ↔  ↔ ¶  Depth 1: main/hya-task-exusiai   ↔  ↔ [#DM-yyyy] ↔  ↔ ¶  Depth 2: .../hya-task-amiya</text>
  <text x="62" y="395" fill="#94a3b8" font-size="11">" Unit Broadcast (#announce-zzzz): Leader-post only; no member list exposed; archived members excluded</text>
  <text x="62" y="416" fill="#94a3b8" font-size="11">" Depth 2 Leaf Rule: Orchestration tools (task, archive, workflow, list_agents, search_agent) hidden at depth 2</text>
  <text x="62" y="437" fill="#34d399" font-size="11">" Workflow Unification (ADR-0017): Compiled Workflow stages execute as resident actors on this exact substrate</text>
  <text x="62" y="458" fill="#64748b" font-size="10.5">" Invariant: "While I am live, my parent is live"  —  a parent cannot report/archive until all direct children archive</text>

  <!-- Right Half: Zero-Trust Secure Relay & Hot Reload -->
  <rect x="608" y="88" width="524" height="236" rx="10" fill="#1e293b" fill-opacity="0.55" stroke="#334155"/>
  <text x="626" y="111" fill="#a78bfa" font-size="11.5" font-weight="700" letter-spacing="0.06em">ZERO-TRUST END-TO-END ENCRYPTED RELAY (ADR-0025)</text>

  <rect x="626" y="126" width="150" height="92" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="638" y="147" fill="#f1f5f9" font-size="12" font-weight="600">Client Machine</text>
  <text x="638" y="165" fill="#94a3b8" font-size="10.5">TUI / WebUI</text>
  <text x="638" y="182" fill="#38bdf8" font-size="10.5">↔ Loopback HTTP</text>
  <text x="638" y="199" fill="#c4b5fd" font-size="10.5">hya bridge (Noise Init)</text>

  <line x1="776" y1="172" x2="804" y2="172" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a-purple)"/>

  <rect x="806" y="126" width="140" height="92" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="818" y="147" fill="#f1f5f9" font-size="12" font-weight="600">Blind Relay</text>
  <text x="818" y="165" fill="#c4b5fd" font-size="10.5">hya proxy</text>
  <text x="818" y="182" fill="#94a3b8" font-size="10.2">Room ID + Ciphertext</text>
  <text x="818" y="199" fill="#64748b" font-size="10.2">Holds ZERO keys</text>

  <line x1="946" y1="172" x2="974" y2="172" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a-purple)"/>

  <rect x="976" y="126" width="138" height="92" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="988" y="147" fill="#f1f5f9" font-size="12" font-weight="600">Backend Host</text>
  <text x="988" y="165" fill="#34d399" font-size="10.5">relay_host (Resp)</text>
  <text x="988" y="182" fill="#94a3b8" font-size="10.5">↔ hyper hya.v2</text>
  <text x="988" y="199" fill="#fbbf24" font-size="10.2">Origin::Relay guard</text>

  <rect x="626" y="232" width="488" height="76" rx="7" fill="#0f172a" stroke="#475569"/>
  <text x="640" y="253" fill="#f1f5f9" font-size="11.5" font-weight="600">Tunnel &amp; Capability Link: Noise_NKpsk0_25519_ChaChaPoly_BLAKE2s</text>
  <text x="640" y="272" fill="#94a3b8" font-size="10.8">" Link: hya://&lt;host&gt;/&lt;room_id&gt;?t=&lt;auto|grpc|ws&gt;#&lt;x25519_pub&gt;.&lt;psk&gt;</text>
  <text x="640" y="290" fill="#94a3b8" font-size="10.8">" Works across HTTP/1.1 proxies &amp; CDNs; hya serve relay rotate revokes old links</text>

  <!-- Bottom Right: Hot Reload vs Stop/Start (ADR-0031) -->
  <rect x="608" y="338" width="524" height="154" rx="10" fill="#1e293b" fill-opacity="0.55" stroke="#334155"/>
  <text x="626" y="361" fill="#34d399" font-size="11.5" font-weight="700" letter-spacing="0.06em">HOT RELOAD VS BINARY STOP/START RECOVERY (ADR-0031)</text>

  <rect x="626" y="374" width="238" height="102" rx="7" fill="#0f172a" stroke="#34d399" stroke-width="1.1"/>
  <text x="640" y="395" fill="#34d399" font-size="12" font-weight="600">Extensions → Hot Reload</text>
  <text x="640" y="414" fill="#94a3b8" font-size="10.5">" Bundles, Plugins, MCP, Skills</text>
  <text x="640" y="431" fill="#94a3b8" font-size="10.5">" Same daemon PID &amp; sockets</text>
  <text x="640" y="448" fill="#94a3b8" font-size="10.5">" Atomic next-turn ConfigGeneration</text>
  <text x="640" y="464" fill="#64748b" font-size="10.2">" Emits live catalogUpdated notice</text>

  <rect x="876" y="374" width="238" height="102" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.1"/>
  <text x="890" y="395" fill="#38bdf8" font-size="12" font-weight="600">Binary → Stop/Start + Restore</text>
  <text x="890" y="414" fill="#94a3b8" font-size="10.5">" hya serve restart drains active runs</text>
  <text x="890" y="431" fill="#94a3b8" font-size="10.5">" Writes Shutdown + pending_resume</text>
  <text x="890" y="448" fill="#94a3b8" font-size="10.5">" New daemon injects restore prompt</text>
  <text x="890" y="464" fill="#64748b" font-size="10.2">" Attached TUIs reconnect &amp; reload</text>
</svg>

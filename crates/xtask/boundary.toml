# Core/bundle boundary guard (ADR-0040), checked by `cargo test -p xtask`.
#
# A crate under `crates/` must not depend on a crate from `bundles/`, and core
# source must not name a bundle domain word in an identifier (comments and
# string literals do not count). The allowlist holds the violations that are
# still being moved out; an entry that no longer matches fails the guard, so
# the list only shrinks. `cargo run -p xtask -- boundary-check --print-findings`
# prints the current violations in allowlist form.

[scan]
roots = ["crates", "packages/hya-tui/src", "proto/hya/v2"]
# Tooling and clients of the offline v1 format are not core.
exclude = ["crates/xtask", "crates/hya-e2e", "crates/hya-migration", "packages/hya-tui/src/proto"]

[identifiers]
deny = ["subagent", "resident", "episode", "team", "mailbox", "channel", "workflow", "goal", "loop_driver", "lsp", "formatter"]
# Generic vocabulary that shares a word with the denylist.
# An entry is an identifier, or `qualifier::identifier` for a path segment.
exempt = [
    # `std::fmt` formatting.
    "Formatter",
    "fmt::Formatter",
    "formatter",
    # Async queues.
    "mpsc::channel",
    "oneshot::channel",
    "broadcast::channel",
    "watch::channel",
    "futures::channel",
    "unbounded_channel",
    "sync_channel",
    # The TUI's IPC link to its extension host process.
    "HostChannel",
    "HostChannelError",
    "HostChannelOptions",
    "hostChannel",
    # `@hya/tui-sdk` text-formatter contributions (not code formatters).
    "formatters",
    "FormatterContribution",
]

# Violations still being moved out (Phase 7); each issue removes its entries.
[allow.dependencies]
"crates/hya-app" = ["hya-agent-channels", "hya-coding-extras-core", "hya-multi-agent", "hya-workflow-bundle", "hya-workflow-bundle-core"]
"crates/hya-core" = ["hya-coding-extras", "hya-compaction", "hya-hashline"]
"crates/hya-engine" = ["hya-agent-channels", "hya-agent-channels-core", "hya-coding-extras", "hya-coding-extras-core", "hya-compaction", "hya-hashline", "hya-multi-agent", "hya-multi-agent-core", "hya-network", "hya-plan", "hya-workflow-bundle"]
"crates/hya-tool" = ["hya-agent-channels", "hya-multi-agent", "hya-workflow-bundle"]
"crates/hya-tool-loader" = ["hya-agent-channels", "hya-coding-extras", "hya-goal", "hya-hashline", "hya-loop", "hya-multi-agent", "hya-network", "hya-plan", "hya-workflow-bundle"]
[allow.identifiers]

[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[package.metadata.hya]
version-reference = "backend"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
hya-app = { workspace = true }
hya-bundle = { workspace = true }
hya-core = { workspace = true }
hya-proto = { workspace = true }
hya-provider = { workspace = true }
hya-store = { workspace = true, features = ["lifecycle-bench"] }
hya-tool = { workspace = true }
hya-version = { workspace = true }
pbjson-build = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
protoc-bin-vendored = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_norway = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tonic-build = { workspace = true }
syn = { version = "2.0.119", features = ["full", "parsing"] }

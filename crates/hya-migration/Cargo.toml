[package]
name = "hya-migration"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standalone v1-to-v2 migration and SHA-256 rollback CLI for hya"

[package.metadata.hya]
version-reference = "hya"

[lints]
workspace = true

[[bin]]
name = "hya-migration"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
hya-bundle = { workspace = true }
hya-proto = { workspace = true }
hya-store = { workspace = true }
hya-tool = { workspace = true }
hya-version = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
hya-app = { workspace = true }

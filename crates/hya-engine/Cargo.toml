[package]
name = "hya-engine"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[package.metadata.hya]
version-reference = "hya"

[lints]
workspace = true

[dependencies]
hya-bundle = { workspace = true }
# Built for its `cdylib`: the internal `hya/compaction` bundle loaded at runtime.
hya-compaction = { workspace = true }
hya-core = { workspace = true }
hya-proto = { workspace = true }
hya-provider = { workspace = true }
hya-tool = { workspace = true }
hya-context = { workspace = true }
hya-workflow = { workspace = true }
hya-store = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
hya-app = { workspace = true }
hya-store = { workspace = true, features = ["lifecycle-bench"] }
hya-base-tools = { workspace = true }
hya-extended-tools = { workspace = true }
hya-channel-tools = { workspace = true }
hya-network-tools = { workspace = true }
sqlx = { workspace = true }

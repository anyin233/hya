[package]
name = "hya-provider"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[package.metadata.hya]
version-reference = "hya"

[features]
default = ["legacy-fake-provider"]
legacy-fake-provider = []
test-support = []

[lints]
workspace = true

[dependencies]
hya-proto = { workspace = true }
hya-version = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
httpdate = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Integration tests build the library without cfg(test).
hya-provider = { workspace = true, features = ["test-support"] }

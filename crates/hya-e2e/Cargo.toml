[package]
name = "hya-e2e"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Process-level agent E2E harness: real hya + scripted FakeLlm"
publish = false

[package.metadata.hya]
version-reference = "hya"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
hya-api = { path = "../hya-api" }
hya-sdk-v1 = { path = "../hya-sdk-v1" }
hya-proto = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
# integration tests may use unwrap
hya-bundle = { path = "../hya-bundle" }
# the seeded handle minter, to predict `HYA_HANDLE_SEED` subagent handles
hya-engine = { path = "../hya-engine" }
# p43 hostile-storage E2E: external SQLite lock setup and read-only disk replay
hya-store = { path = "../hya-store" }
sqlx = { workspace = true }
# p38 relay golden path: PTY WebSocket over the bridge, link secret decoding,
# and a self-signed certificate for the proxy's TLS run
base64 = { workspace = true }
futures = { workspace = true }
rcgen = { workspace = true }
tokio-tungstenite = { workspace = true }

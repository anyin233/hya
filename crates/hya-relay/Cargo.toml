[package]
name = "hya-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "hya secure relay: hya.relay.v1 rendezvous protocol, transport abstraction, and relay links (no hya runtime deps)"

[lints]
workspace = true

[features]
# A tiny in-process HTTP/1.1-only hop (`testing::Http1OnlyHop`) for crates
# outside `hya-relay` that need a real intermediary in front of a
# `RelayServer` in their own tests (for example `hya relay doctor`). Not part
# of the stable API; doc(hidden).
testing = ["hyper/client"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
data-encoding = { workspace = true }
ed25519-dalek = { workspace = true }
futures = { workspace = true }
hmac = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
prost = { workspace = true }
rand_core = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pki-types = { workspace = true }
sha2 = { workspace = true }
snow = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
webpki-roots = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
hyper = { workspace = true, features = ["client"] }
rcgen = { workspace = true }
tokio = { workspace = true }

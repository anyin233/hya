[profile.ci]
# One failing test must not hide failures behind it.
fail-fast = false
# Warn at 5s and hard-terminate at 20s (4 * 5s) so slow sleeps cannot regress silently.
slow-timeout = { period = "5s", terminate-after = 4 }
status-level = "pass"
final-status-level = "flaky"
# Include the five lockstep first-party native bundle cdylibs in a fixed
# Cargo 1.100 build-unit layout (`debug/build/<pkg>/ci-archive/out/`) plus
# the two `hya-tool` cdylib example fixtures so both `NEXTEST_BIN_EXE_hya` and
# archived test binaries can dlopen them on zero-compile runners without
# packing intermediate rlib/rmeta files.
archive.include = [
  { path = "debug/build/hya-hashline/ci-archive/out/libhya_hashline.so", relative-to = "target", on-missing = "error" },
  { path = "debug/build/hya-coding-extras/ci-archive/out/libhya_coding_extras.so", relative-to = "target", on-missing = "error" },
  { path = "debug/build/hya-extended-tools/ci-archive/out/libhya_extended_tools.so", relative-to = "target", on-missing = "error" },
  { path = "debug/build/hya-agent-channels/ci-archive/out/libhya_agent_channels.so", relative-to = "target", on-missing = "error" },
  { path = "debug/build/hya-network/ci-archive/out/libhya_network.so", relative-to = "target", on-missing = "error" },
  { path = "debug/build/hya-compaction/ci-archive/out/libhya_compaction.so", relative-to = "target", on-missing = "error" },
  { path = "debug/build/hya-plan/ci-archive/out/libhya_plan.so", relative-to = "target", on-missing = "error" },
  { path = "debug/build/hya-goal/ci-archive/out/libhya_goal.so", relative-to = "target", on-missing = "error" },
  { path = "debug/build/hya-loop/ci-archive/out/libhya_loop.so", relative-to = "target", on-missing = "error" },
  { path = "debug/build/hya-workflow-bundle/ci-archive/out/libhya_workflow_bundle.so", relative-to = "target", on-missing = "error" },
  { path = "debug/examples/libreplacement_tools.so", relative-to = "target", on-missing = "error" },
  { path = "debug/examples/libwrong_abi_tools.so", relative-to = "target", on-missing = "error" },
  { path = "debug/examples/libtest_v2_bundle.so", relative-to = "target", on-missing = "error" },
  { path = "debug/examples/libwrong_abi_v2_bundle.so", relative-to = "target", on-missing = "error" },
]

[profile.ci-e2e]
fail-fast = false
test-threads = 4
# Process E2E tests spawn real `hya` backends: warn at 15s, terminate at 60s.
slow-timeout = { period = "15s", terminate-after = 4 }
status-level = "pass"
final-status-level = "flaky"

[profile.nightly]
fail-fast = false
# Ignored soak and OS-fault tests: warn at 30s, terminate at 120s.
slow-timeout = { period = "30s", terminate-after = 4 }
status-level = "pass"
final-status-level = "flaky"

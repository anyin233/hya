api_version: hya.agent-bundle/v1
kind: AgentBundle
identity:
  id: hya/core-agents
  version: 0.34.8
  publisher: hya
agents:
  - local_id: build
    stable_id: build
    description: The default agent. Executes tools based on configured permissions.
    role: main
    spawn_lifecycle: transient
    harness_access: full
    can_spawn: &ordinary_agents
      - build
      - explore
      - general
      - hya-docs
      - hya-explorer
      - hya-implementer
      - hya-main
      - hya-planner
      - hya-release
      - hya-reviewer
      - hya-tester
      - plan
  - local_id: compaction
    stable_id: compaction
    role: subagent
    prompt: prompts/compaction.md
    spawn_lifecycle: transient
    harness_access: full
  - local_id: explore
    stable_id: explore
    description: >-
      Fast agent specialized for exploring codebases. Use this when you need to quickly find files by patterns (eg. "src/components/**/*.tsx"), search code for keywords (eg. "API endpoints"), or answer questions about the codebase (eg. "how do API endpoints work?"). When calling this agent, specify the desired thoroughness level: "quick" for basic searches, "medium" for moderate exploration, or "very thorough" for comprehensive analysis across multiple locations and naming conventions.
    role: subagent
    prompt: prompts/explore.md
    spawn_lifecycle: transient
    harness_access: full
    can_spawn: *ordinary_agents
  - local_id: general
    stable_id: general
    description: General-purpose agent for researching complex questions and executing multi-step tasks. Use this agent to execute multiple units of work in parallel.
    role: subagent
    spawn_lifecycle: transient
    harness_access: full
    can_spawn: *ordinary_agents
  - local_id: plan
    stable_id: plan
    description: Plan mode. Planning-focused agent for designs and task breakdowns.
    role: main
    spawn_lifecycle: transient
    harness_access: full
    can_spawn: *ordinary_agents
  - local_id: summary
    stable_id: summary
    role: subagent
    prompt: prompts/summary.md
    spawn_lifecycle: transient
    harness_access: full
  - local_id: title
    stable_id: title
    role: subagent
    prompt: prompts/title.md
    spawn_lifecycle: transient
    harness_access: full

kind: Bundle
schema_version: 2
version_ref: hya
identity:
  id: hya/agent-channels
  version: 0.0.0
  publisher: hya
namespace: agent-channels
runtime:
  kind: native
  abi_version: 2
  crate_dir: native
  capabilities:
    - tools
    - hooks
    - services
    - schemas
    - apis
resources:
  tools:
    - id: send
      path: tools/send.json
    - id: list_channel
      path: tools/list_channel.json
    - id: report
      path: tools/report.json
    - id: wait
      path: tools/wait.json
      overrides: hya/multi-agent
channels:
  - id: unit-default
    kind: unit
    participants:
      - { kind: role, role: unit_leader }
      - { kind: role, role: direct_reports }
    capabilities: [send, steer, follow_up, resident_mail]
    scope: unit
    retention: team_session
  - id: parent-dm-default
    kind: parent_dm
    participants:
      - { kind: role, role: parent }
      - { kind: role, role: child }
    capabilities: [send, report, steer, follow_up, resident_mail]
    scope: vertical
    retention: team_session
assets:
  - { id: tui-main, path: tui/main.ts }
  - { id: tui-renderers, path: tui/renderers.ts }
  - { id: tui-status, path: tui/status.ts }
tui:
  api_version: 2
  entry: tui/main.ts
  sdk: "2.0.0"
  permissions:
    - tui.render
    - tui.status_item
    - tui.session.read
    - tui.transcript.read
    - tui.bundle_api
    - tui.extension_state.read

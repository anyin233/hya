kind: Bundle
schema_version: 2
version_ref: hya
identity:
  id: hya/workflow
  version: 0.0.0
  publisher: hya
namespace: workflow
runtime:
  kind: native
  abi_version: 2
  crate_dir: native
  capabilities:
    - tools
    - services
    - apis
resources:
  tools:
    - id: workflow
      path: tools/workflow.json
workflow:
  id: plan-impl-review
  path: workflows/plan-impl-review.hya.md
agents:
  - id: hya-pir-planner
    private: true
    role: subagent
    prompt: prompts/planner.md
  - id: hya-pir-implementer
    private: true
    role: subagent
    prompt: prompts/implementer.md
  - id: hya-pir-reviewer
    private: true
    role: subagent
    prompt: prompts/reviewer.md
assets:
  - { id: tui-main, path: tui/main.ts }
  - { id: tui-workflows, path: tui/workflows.ts }
  - { id: tui-commands, path: tui/commands.ts }
tui:
  api_version: 2
  entry: tui/main.ts
  sdk: "2.1.0"
  permissions:
    - tui.render
    - tui.transcript.read
    - tui.panel
    - tui.action
    - tui.keys
    - tui.session.read
    - tui.workspace.read
    - tui.bundle_api
    - tui.extension_state.read

kind: Bundle
schema_version: 2
version_ref: hya
identity:
  id: hya/code-mode
  version: 0.0.0
  publisher: hya
check:
  command: [bun, test, --pass-with-no-tests]
  timeout_secs: 120
runtime:
  kind: js
  mode: process
  entry: runtime.ts
  command: [bun, run, '${BUNDLE_ROOT}/runtime.ts', run]
  timeout_ms: 3600000
resources:
  tools:
    - id: run
      path: runtime.ts

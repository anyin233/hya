api_version: hya.agent-bundle/v1
kind: AgentBundle
identity:
  id: hya/development
  version: 0.34.8
  publisher: hya
agents:
  - local_id: hya-docs
    stable_id: hya-docs
    description: Transient subagent for requested documentation, API docs, glossary, and ADR updates.
    role: subagent
    prompt: prompts/hya-docs.md
    spawn_lifecycle: transient
    harness_access: full
    can_spawn: &ordinary_agents
      - build
      - explore
      - general
      - hya-docs
      - hya-explorer
      - hya-implementer
      - hya-main
      - hya-planner
      - hya-release
      - hya-reviewer
      - hya-tester
      - plan
  - local_id: hya-explorer
    stable_id: hya-explorer
    description: Transient subagent for codebase reconnaissance, flows, conventions, and blast radius.
    role: subagent
    prompt: prompts/hya-explorer.md
    spawn_lifecycle: transient
    harness_access: full
    can_spawn: *ordinary_agents
  - local_id: hya-implementer
    stable_id: hya-implementer
    description: Transient subagent for focused code changes after scope and target files are clear.
    role: subagent
    prompt: prompts/hya-implementer.md
    spawn_lifecycle: transient
    harness_access: full
    can_spawn: *ordinary_agents
  - local_id: hya-main
    stable_id: hya-main
    description: Default primary agent for coding work. Delegates to specialist subagents and integrates verified results.
    role: main
    prompt: prompts/hya-main.md
    spawn_lifecycle: transient
    harness_access: full
    can_spawn: *ordinary_agents
  - local_id: hya-planner
    stable_id: hya-planner
    description: Transient subagent for design tradeoffs, implementation plans, and task breakdowns.
    role: subagent
    prompt: prompts/hya-planner.md
    spawn_lifecycle: transient
    harness_access: full
    can_spawn: *ordinary_agents
  - local_id: hya-release
    stable_id: hya-release
    description: Transient subagent for version, changelog, tag, and release readiness work.
    role: subagent
    prompt: prompts/hya-release.md
    spawn_lifecycle: transient
    harness_access: full
    can_spawn: *ordinary_agents
  - local_id: hya-reviewer
    stable_id: hya-reviewer
    description: Transient subagent for correctness, standards, security, and simplification review.
    role: subagent
    prompt: prompts/hya-reviewer.md
    spawn_lifecycle: transient
    harness_access: full
    can_spawn: *ordinary_agents
  - local_id: hya-tester
    stable_id: hya-tester
    description: Transient subagent for TDD tests, behavioral coverage, and focused verification.
    role: subagent
    prompt: prompts/hya-tester.md
    spawn_lifecycle: transient
    harness_access: full
    can_spawn: *ordinary_agents

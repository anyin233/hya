kind: Bundle
schema_version: 2
version_ref: hya
identity:
  id: hya/multi-agent
  version: 0.0.0
  publisher: hya
namespace: multi-agent
runtime:
  kind: native
  abi_version: 2
  crate_dir: native
  capabilities:
    - tools
    - hooks
    - services
    - apis
resources:
  tools:
    - id: list_agents
      path: tools/list_agents.json
    - id: task
      path: tools/task.json
    - id: search_agent
      path: tools/search_agent.json
    - id: archive
      path: tools/archive.json
    - id: wait
      path: tools/wait.json
agents:
  - path: agents/hya-task.md
  - path: agents/hya-scout.md
  - path: agents/hya-reviewer.md
assets:
  - { id: tui-main, path: tui/main.ts }
  - { id: tui-state, path: tui/state.ts }
  - { id: tui-subagents, path: tui/subagents.ts }
  - { id: tui-viewer, path: tui/viewer.ts }
  - { id: tui-commands, path: tui/commands.ts }
tui:
  api_version: 2
  entry: tui/main.ts
  sdk: "2.0.0"
  permissions:
    - tui.panel
    - tui.action
    - tui.keys
    - tui.session.read
    - tui.sessions.read
    - tui.bundle_api
    - tui.extension_state.read
    - tui.transcript.embed

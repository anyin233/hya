# Example config for hya-extra/jev-model-router. Copy it to
#   <hya config dir>/bundles/hya-extra%2Fjev-model-router/config.yml
# (for example ~/.config/hya/bundles/hya-extra%2Fjev-model-router/config.yml),
# or to .hya/bundles/<dir>/config.yml for a `--project` install.
# This file is documentation only; it is not declared in bundle.yaml and is
# never packaged. The router reads config.yml once at start; hya restarts the
# process at the next root binding after the file's content changes (which also
# clears the router's cached decisions). Editing only the api_key_file target
# does not change config.yml, so restart hya after rotating that key.

jev:
  endpoint: https://api.typesafe.ai/v1/systemone   # default
  model: jev-latest                                 # default
  # Exactly one of api_key / api_key_file. The process gets no HOME, so an
  # api_key_file path must be absolute.
  api_key_file: /Users/me/.config/typesafe/api-key
  # api_key: ts-...
  timeout_ms: 2000        # default; 1..=20000 (hya's hook budget is 30 s)
  min_confidence: 0.5     # default; below this Jev's verdict is ignored

route:
  # Only rewrite requests whose incoming model is listed. Empty (default)
  # routes every request, including subagents pinned to their own model.
  from: []
  default_tier: medium    # default: the last (hardest) tier
  stickiness: chain       # chain (default) | session | none
  escalate: false         # true: re-ask on each new root user message, only ever move up

tiers:                    # ordered easy -> hard
  - name: easy
    model: openai/gpt-5.4-mini
    criteria: Short questions, lookups, trivial one-file edits
  - name: medium
    model: anthropic/claude-sonnet-5
    criteria: Normal feature work or bug fixes touching a few files
  - name: hard
    model: anthropic/claude-opus-5-5
    criteria: Cross-cutting design, concurrency, migrations, subtle debugging

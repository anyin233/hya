kind: Plugin
identity:
  id: hya-extra/token-summary
  version: 0.41.0
  publisher: hya-extra
# An explicit `extensions.process` is spawned with its argv as-is (no Bun
# adapter is injected), so summary.ts speaks the hya plugin protocol v1
# (newline-delimited JSON-RPC 2.0 over stdio) itself.
extensions:
  process:
    kind: bun
    command: [bun, run, '${BUNDLE_ROOT}/summary.ts']
  files:
    - id: summary
      path: summary.ts
resources:
  tools:
    - id: token_summary
      path: summary.ts
views:
  - id: usage
    description: Per-model token usage of the session tree

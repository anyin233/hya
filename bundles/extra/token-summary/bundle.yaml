kind: Bundle
schema_version: 2
version_ref: hya
identity:
  id: hya-extra/token-summary
  version: 0.0.0
  publisher: hya-extra
check:
  command: [bun, test, --pass-with-no-tests]
  timeout_secs: 120
# An explicit `runtime` with `mode: process` is spawned with its argv as-is (no Bun
# adapter is injected), so summary.ts speaks the hya plugin protocol v1
# (newline-delimited JSON-RPC 2.0 over stdio) itself.
runtime:
  kind: js
  mode: process
  entry: summary.ts
  command: [bun, run, '${BUNDLE_ROOT}/summary.ts']
assets:
  - id: usage-schema
    path: schemas/usage.json
resources:
  tools:
    - id: token_summary
      path: summary.ts
# GET /v1/sessions/{session}/bundles/hya-extra%2Ftoken-summary/usage
apis:
  - id: usage
    method: GET
    scope: session
    path: /usage
    description: Per-model token usage of the session tree
    response_schema: schemas/usage.json

kind: Bundle
version_ref: backend
identity:
  id: hya-extra/orchestrator
  version: 0.0.0
  publisher: hya-extra
extensions:
  process:
    kind: bun
    command: [bun, run, '${BUNDLE_ROOT}/runtime.ts']
    timeout_ms: 3600000
  files:
    - id: runtime
      path: runtime.ts
resources:
  tools:
    - id: workflow
      path: runtime.ts
agents:
  - id: orchestrator
    description: Coordinates specialised workers through reusable traced workflows.
    role: main
    prompt: prompts/orchestrator.md
    advertise: [workflow]
    can_spawn: [orchestrator-scout, orchestrator-runner, orchestrator-editor]
    resource_view:
      allow: [workflow]
  - id: orchestrator-scout
    description: Finds facts by reading and searching files.
    role: subagent
    handoff: deterministic
    prompt: prompts/scout.md
    resource_view:
      allow:
        - harness:tool/read
        - harness:tool/grep
        - harness:tool/glob
  - id: orchestrator-runner
    description: Runs commands and reads files to report what happened.
    role: subagent
    handoff: deterministic
    prompt: prompts/runner.md
    resource_view:
      allow:
        - harness:tool/bash
        - harness:tool/read
  - id: orchestrator-editor
    description: Reads, searches and changes files without running commands.
    role: subagent
    handoff: deterministic
    prompt: prompts/editor.md
    resource_view:
      allow:
        - harness:tool/read
        - harness:tool/grep
        - harness:tool/glob
        - harness:tool/write
        - harness:tool/edit

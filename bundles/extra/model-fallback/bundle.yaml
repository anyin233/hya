kind: Bundle
version_ref: hya
identity:
  id: hya-extra/model-fallback
  version: 0.0.0
  publisher: hya-extra
check:
  command: [bun, test, --pass-with-no-tests]
  timeout_secs: 120
extensions:
  process:
    kind: bun
    command: [bun, run, '${BUNDLE_ROOT}/fallback.ts']
  files:
    - id: fallback
      path: fallback.ts
resources:
  hooks:
    - id: model.fallback
      path: hooks/model-fallback.json

schema_version: 1
identity: hya/base-tools
protected_names: [read]
schemes: []
tools:
  - { name: read, schema_version: 1, permission: read_only }
  - { name: write, schema_version: 1, permission: tool }
  - { name: edit, schema_version: 1, permission: tool }
  - { name: ls, schema_version: 1, permission: read_only }
  - { name: glob, schema_version: 1, permission: read_only }
  - { name: find, schema_version: 1, permission: read_only }
  - { name: grep, schema_version: 1, permission: read_only }
  - name: ask_user
    schema_version: 1
    permission: tool
    aliases: [{ name: question, visibility: hidden }]
  - name: bash
    schema_version: 1
    permission: command
    aliases: [{ name: shell, visibility: hidden }]
  - name: apply_patch
    schema_version: 1
    permission: tool
    aliases: [{ name: patch, visibility: hidden }]

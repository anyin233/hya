kind: Bundle
schema_version: 2
version_ref: hya
identity:
  id: hya/cli-driver-example
  version: 0.0.0
  publisher: hya
runtime:
  kind: native
  abi_version: 2
  crate_dir: native
  capabilities:
    - drivers
    - apis
cli:
  - name: example-echo
    about: Print text through the example bundle's `echo` driver.
    driver: echo
    args:
      - { id: text, long: text, required: true, help: Text to print. }
      - { id: times, long: times, value: integer, default: "1", help: How many times. }
      - { id: loud, long: loud, value: flag, help: Print in upper case. }
  - name: example-status
    about: Ask the example bundle's BundleApi for its status.
    api: status
    args:
      - { id: name, long: name, help: Name shown in the status line. }
  - name: example-db-status
    about: Ask the example bundle's BundleApi for its status, on `--db`.
    api: status
    database: true
    args:
      - { id: name, long: name, help: Name shown in the status line. }
  - name: example-session
    about: Report the Session the example bundle's Session-scope endpoint runs for.
    api: session
    database: true
    args:
      - { id: session, long: session, value: session, help: An existing Session (default a new one). }
      - { id: delay_ms, long: delay-ms, value: integer, help: Block the endpoint this long first. }
      - { id: slow, long: slow, value: flag, help: Refused when routed to a server. }
    routed_refuse:
      - { arg: slow, reason: "`example-session --slow` cannot be sent to it" }
      - { flag: yolo, reason: "--yolo cannot apply to it" }
